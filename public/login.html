<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · ЛогистПро</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="login-page" x-data="loginPage()" x-init="init()">
        <div class="login-card fade-in">
            
            <div class="login-logo">
                <div class="login-logo-mark">LP</div>
                <h1 class="login-title">ЛогистПро</h1>
                <p class="login-subtitle">Система управления доставкой</p>
            </div>

            <form @submit.prevent="submit()">
                <div x-show="error" x-cloak class="alert alert-error" x-text="error"></div>

                <div class="form-group">
                    <label class="form-label">Логин</label>
                    <input 
                        type="text" 
                        class="form-input" 
                        :class="error && !form.login ? 'error' : ''"
                        x-model="form.login"
                        autocomplete="username"
                        :disabled="loading"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input 
                        type="password" 
                        class="form-input" 
                        :class="error && !form.password ? 'error' : ''"
                        x-model="form.password"
                        autocomplete="current-password"
                        :disabled="loading"
                    >
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    style="width:100%;"
                    :disabled="loading"
                >
                    <span x-show="!loading">Войти</span>
                    <span x-show="loading" x-cloak>Проверка...</span>
                </button>
            </form>

        </div>
    </div>

    <script>
        function loginPage() {
            return {
                form: {
                    login: '',
                    password: ''
                },
                loading: false,
                error: '',

                init() {
                    if (!window.AUTH) {
                        setTimeout(() => this.init(), 50);
                        return;
                    }
                    if (window.AUTH.redirectIfLoggedIn()) return;
                },

                async submit() {
                    this.error = '';

                    if (!this.form.login || !this.form.password) {
                        this.error = 'Заполните все поля';
                        return;
                    }

                    this.loading = true;

                    try {
                        const data = await window.API.api('/api/auth?action=login', {
                            method: 'POST',
                            body: JSON.stringify(this.form)
                        });

                        window.API.setAuth(data.token, data.user);
                        window.location.href = '/';

                    } catch (e) {
                        this.error = e.message || 'Ошибка входа';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
