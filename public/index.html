<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска рейсов · ЛогистПро</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="boardPage()" x-init="$nextTick(() => init())">

    <header class="app-header">
        <div class="app-header-left">
            <a href="/" class="app-logo">
                <span class="app-logo-mark">LP</span>
                <span>ЛогистПро</span>
            </a>
            <nav class="app-nav">
                <a href="/" class="app-nav-link active">Рейсы</a>
                <a href="/incoming.html" class="app-nav-link">Входящие</a>
                <a href="/reports.html" class="app-nav-link">Отчёты</a>
                <a href="/references.html" class="app-nav-link">Справочники</a>
                <a href="/journal.html" class="app-nav-link">Журнал</a>
            </nav>
        </div>
        <div class="app-header-right">
            <div class="user-badge">
                <div class="user-avatar" x-text="userInitials"></div>
                <div>
                    <div x-text="user?.full_name || ''" style="font-weight:500;"></div>
                    <div x-text="roleLabel" style="font-size:11px;opacity:0.7;"></div>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" @click="logout()" style="color:rgba(255,255,255,0.85);" title="Выйти">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div class="container">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                <div>
                    <h1 style="font-size:24px;font-weight:600;margin:0 0 4px 0;">Доска рейсов</h1>
                    <p style="font-size:13px;color:var(--text-secondary);margin:0;">
                        Управление рейсами и статусами доставки
                    </p>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-secondary" @click="loadData()" :disabled="loading">
                        Обновить
                    </button>
                    <button class="btn btn-primary" @click="openTripModal()">
                        Новый рейс
                    </button>
                </div>
            </div>

            <div x-show="error" x-cloak class="alert alert-error" x-text="error"></div>

            <div x-show="loading" class="skeleton" style="height:400px;"></div>

            <div x-show="!loading" class="board">
                <template x-for="col in columns" :key="col.status">
                    <div class="board-column" :class="dragOverStatus === col.status ? 'drag-over' : ''"
                         @dragover.prevent="dragOverStatus = col.status"
                         @dragleave="dragOverStatus = null"
                         @drop="dropTrip(col.status)">
                        <div class="board-column-header">
                            <span x-text="col.title"></span>
                            <span class="board-column-count" x-text="tripsByStatus(col.status).length"></span>
                        </div>
                        <template x-for="t in tripsByStatus(col.status)" :key="t.id">
                            <div class="trip-card"
                                 :class="draggedTripId === t.id ? 'dragging' : ''"
                                 draggable="true"
                                 @dragstart="dragStart(t.id)"
                                 @dragend="dragEnd()"
                                 @click="openTrip(t.id)">
                                <div class="trip-card-number" x-text="t.trip_number"></div>
                                <div class="trip-card-date" x-text="formatTripDate(t.trip_date)"></div>
                                <div class="trip-card-row" x-text="t.vehicle_plate || '—'"></div>
                                <div class="trip-card-row" x-text="t.driver_name || '—'"></div>
                                <div class="trip-card-load">
                                    <div x-text="t.orders_count + ' адресов · ' + (t.fact_km || 0) + ' км'"></div>
                                </div>
                            </div>
                        </template>
                        <div x-show="tripsByStatus(col.status).length === 0" style="padding:20px;text-align:center;font-size:12px;color:var(--text-muted);">
                            Нет рейсов
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </main>

    <!-- МОДАЛКА: НОВЫЙ РЕЙС -->
    <div x-show="tripModal.open" x-cloak class="modal-backdrop" @click.self="closeTripModal()">
        <div class="modal-window modal-window-wide" @click.stop>
            <div class="modal-header">
                <h2 class="modal-title">Новый рейс</h2>
                <button class="modal-close" @click="closeTripModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <div x-show="tripModal.error" class="alert alert-error" x-text="tripModal.error"></div>

                <!-- Секция 1: Основные данные -->
                <div class="form-section">
                    <h3 class="form-section-title">Основные данные</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Дата рейса *</label>
                            <input type="date" class="form-input" x-model="tripModal.form.trip_date" :disabled="tripModal.saving">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Тип рейса *</label>
                            <select class="form-input" x-model="tripModal.form.trip_type" :disabled="tripModal.saving">
                                <option value="city">Городской</option>
                                <option value="intercity">Междугородний</option>
                            </select>
                        </div>
                    </div>

                    <!-- Машина: свои / наёмная -->
                    <div class="form-group">
                        <label class="form-label">Машина *</label>
                        <div class="type-switch">
                            <button type="button" class="type-switch-btn" :class="tripModal.form.vehicle_mode === 'own' ? 'active' : ''" @click="setVehicleMode('own')">
                                Своя (из справочника)
                            </button>
                            <button type="button" class="type-switch-btn" :class="tripModal.form.vehicle_mode === 'hired' ? 'active' : ''" @click="setVehicleMode('hired')">
                                Наёмная
                            </button>
                        </div>
                    </div>

                    <template x-if="tripModal.form.vehicle_mode === 'own'">
                        <div class="form-group">
                            <select class="form-input" x-model.number="tripModal.form.vehicle_id" @change="onVehicleChange()" :disabled="tripModal.saving">
                                <option :value="null">— Выберите машину —</option>
                                <template x-for="v in vehicles" :key="v.id">
                                    <option :value="v.id" x-text="v.plate + ' · ' + (v.model || '') + ' · ' + (v.volume || '?') + ' м³'"></option>
                                </template>
                            </select>
                        </div>
                    </template>

                    <template x-if="tripModal.form.vehicle_mode === 'hired'">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Марка / госномер *</label>
                                <input type="text" class="form-input" x-model="tripModal.form.hired_vehicle_info" placeholder="Газель А123ВС" :disabled="tripModal.saving">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Объём, м³ *</label>
                                <input type="number" class="form-input" x-model.number="tripModal.form.vehicle_volume" step="0.1" min="0" :disabled="tripModal.saving">
                            </div>
                        </div>
                    </template>

                    <!-- Водитель: свои / наёмный -->
                    <div class="form-group">
                        <label class="form-label">Водитель *</label>
                        <div class="type-switch">
                            <button type="button" class="type-switch-btn" :class="tripModal.form.driver_mode === 'own' ? 'active' : ''" @click="setDriverMode('own')">
                                Свой (из справочника)
                            </button>
                            <button type="button" class="type-switch-btn" :class="tripModal.form.driver_mode === 'hired' ? 'active' : ''" @click="setDriverMode('hired')">
                                Наёмный
                            </button>
                        </div>
                    </div>

                    <template x-if="tripModal.form.driver_mode === 'own'">
                        <div class="form-group">
                            <select class="form-input" x-model.number="tripModal.form.driver_id" @change="onDriverChange()" :disabled="tripModal.saving">
                                <option :value="null">— Выберите водителя —</option>
                                <template x-for="d in drivers" :key="d.id">
                                    <option :value="d.id" x-text="d.full_name + ' · ' + (d.default_rate || 0) + ' ₽'"></option>
                                </template>
                            </select>
                        </div>
                    </template>

                    <template x-if="tripModal.form.driver_mode === 'hired'">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">ФИО водителя *</label>
                                <input type="text" class="form-input" x-model="tripModal.form.hired_driver_info" placeholder="Петров П.П." :disabled="tripModal.saving">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ставка за рейс, ₽</label>
                                <input type="number" class="form-input" x-model.number="tripModal.form.driver_rate" min="0" :disabled="tripModal.saving">
                            </div>
                        </div>
                    </template>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Пробег план, км</label>
                            <input type="number" class="form-input" x-model.number="tripModal.form.plan_km" min="0" :disabled="tripModal.saving">
                        </div>
                        <div class="form-group" x-show="tripModal.form.trip_type === 'intercity'">
                            <label class="form-label">Маршрут</label>
                            <select class="form-input" x-model.number="tripModal.form.route_id" :disabled="tripModal.saving">
                                <option :value="null">— Выберите маршрут —</option>
                                <template x-for="r in routes" :key="r.id">
                                    <option :value="r.id" x-text="r.name + ' · ' + (r.distance_km || 0) + ' км'"></option>
                                </template>
                            </select>
                        </div>
                        <div class="form-group" x-show="tripModal.form.trip_type === 'city'">
                            <label class="form-label">Комментарий</label>
                            <input type="text" class="form-input" x-model="tripModal.form.comment" placeholder="Необязательно" :disabled="tripModal.saving">
                        </div>
                    </div>

                    <template x-if="showRevenue">
                        <div class="form-group">
                            <label class="form-label">Выручка за рейс, ₽</label>
                            <input type="number" class="form-input" x-model.number="tripModal.form.revenue" min="0" placeholder="Сколько клиент платит за рейс" :disabled="tripModal.saving">
                        </div>
                    </template>
                </div>

                <!-- Секция 2: Адреса доставки -->
                <div class="form-section">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                        <h3 class="form-section-title" style="margin:0;">Адреса доставки</h3>
                        <button class="btn btn-secondary btn-sm" @click="addAddress()" :disabled="tripModal.saving">
                            + Добавить адрес
                        </button>
                    </div>

                    <!-- Индикатор загрузки -->
                    <div x-show="tripModal.form.vehicle_id" style="margin-bottom:16px;">
                        <div class="load-info">
                            <span>Загрузка: <strong x-text="totalVolume + ' м³'"></strong> из <strong x-text="selectedVehicleVolume + ' м³'"></strong></span>
                            <span><strong x-text="loadPercent + '%'"></strong></span>
                        </div>
                        <div class="load-bar">
                            <div class="load-bar-fill" :class="loadColor" :style="'width:' + Math.min(loadPercent, 100) + '%'"></div>
                        </div>
                    </div>

                    <div x-show="tripModal.form.addresses.length === 0" class="address-list">
                        <div class="address-list-empty">
                            Нет адресов. Нажмите «+ Добавить адрес», чтобы начать.
                        </div>
                    </div>

                    <div x-show="tripModal.form.addresses.length > 0" class="address-list">
                        <div class="address-list-header">
                            <div>№</div>
                            <div>ID заказа</div>
                            <div>Адрес</div>
                            <div>Контакт</div>
                            <div>Телефон</div>
                            <div>м³</div>
                            <div>Примечание</div>
                            <div></div>
                        </div>
                        <template x-for="(addr, index) in tripModal.form.addresses" :key="index">
                            <div class="address-list-row">
                                <div class="seq-num" x-text="index + 1"></div>
                                <input type="text" x-model="addr.external_id" placeholder="#12345" :disabled="tripModal.saving">
                                <input type="text" x-model="addr.address" placeholder="ул. Ленина, 15" :disabled="tripModal.saving">
                                <input type="text" x-model="addr.contact_name" placeholder="Иванов И.И." :disabled="tripModal.saving">
                                <input type="text" x-model="addr.phone" placeholder="+79001234567" :disabled="tripModal.saving">
                                <input type="number" x-model.number="addr.volume" step="0.1" min="0" :disabled="tripModal.saving">
                                <textarea x-model="addr.note" placeholder="Примечание" :disabled="tripModal.saving"></textarea>
                                <button class="btn-remove" @click="removeAddress(index)" :disabled="tripModal.saving" title="Удалить">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" @click="closeTripModal()" :disabled="tripModal.saving">Отмена</button>
                <button class="btn btn-primary" @click="saveTrip()" :disabled="tripModal.saving">
                    <span x-show="!tripModal.saving">Создать рейс</span>
                    <span x-show="tripModal.saving" x-cloak>Сохранение...</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function boardPage() {
            return {
                user: null,
                trips: [],
                vehicles: [],
                drivers: [],
                routes: [],
                loading: true,
                error: '',

                draggedTripId: null,
                dragOverStatus: null,

                columns: [
                    { status: 'forming', title: 'Формируется' },
                    { status: 'loading', title: 'Загрузка' },
                    { status: 'transit', title: 'В пути' },
                    { status: 'done', title: 'Завершён' }
                ],

                tripModal: {
                    open: false,
                    saving: false,
                    error: '',
                    form: {}
                },
                showRevenue: false,

                get userInitials() {
                    if (!this.user?.full_name) return '?';
                    return this.user.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                },

                get roleLabel() {
                    const roles = { 'admin': 'Администратор', 'senior_logist': 'Ст. логист', 'logist': 'Логист', 'manager': 'Руководитель', 'viewer': 'Наблюдатель' };
                    return roles[this.user?.role] || this.user?.role || '';
                },

                get selectedVehicleVolume() {
                    if (this.tripModal.form.vehicle_mode === 'hired') {
                        return Number(this.tripModal.form.vehicle_volume) || 0;
                    }
                    const v = this.vehicles.find(x => x.id === this.tripModal.form.vehicle_id);
                    return v ? Number(v.volume) : 0;
                },

                get totalVolume() {
                    const total = this.tripModal.form.addresses.reduce((sum, a) => sum + (Number(a.volume) || 0), 0);
                    return Math.round(total * 100) / 100;
                },

                get loadPercent() {
                    const cap = this.selectedVehicleVolume;
                    if (!cap) return 0;
                    return Math.round(this.totalVolume / cap * 100);
                },

                get loadColor() {
                    const p = this.loadPercent;
                    if (p > 100) return 'load-orange';
                    if (p >= 81) return 'load-green';
                    if (p >= 51) return 'load-yellow';
                    return 'load-red';
                },

                async init() {
                    if (!window.AUTH) {
                        setTimeout(() => this.init(), 50);
                        return;
                    }
                    if (!window.AUTH.requireLogin()) return;
                    this.user = window.API.getUser();
                    
                    // Загружаем настройки (для show_revenue)
                    try {
                        const settings = await window.API.api('/api/settings');
                        const showRevenueSetting = (settings.settings || []).find(s => s.key === 'show_revenue');
                        this.showRevenue = showRevenueSetting?.value === 'true';
                    } catch (e) {
                        console.error('Ошибка загрузки настроек:', e);
                        this.showRevenue = false;
                    }
                    
                    await this.loadData();
                },

                async loadData() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const [trips, vehicles, drivers, routes] = await Promise.all([
                            window.API.api('/api/trips'),
                            window.API.api('/api/vehicles'),
                            window.API.api('/api/drivers'),
                            window.API.api('/api/routes')
                        ]);
                        this.trips = trips.trips || [];
                        this.vehicles = vehicles.vehicles || [];
                        this.drivers = drivers.drivers || [];
                        this.routes = routes.routes || [];
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                formatTripDate(d) {
                    if (!d) return '—';
                    return window.HELPERS.formatDate(d);
                },

                tripsByStatus(status) {
                    return this.trips.filter(t => t.status === status);
                },

                openTrip(tripId) {
                    window.location.href = '/trip.html?id=' + tripId;
                },

                // ============ DRAG & DROP ============

                dragStart(tripId) {
                    this.draggedTripId = tripId;
                },

                dragEnd() {
                    this.draggedTripId = null;
                    this.dragOverStatus = null;
                },

                async dropTrip(newStatus) {
                    const tripId = this.draggedTripId;
                    this.dragOverStatus = null;
                    this.draggedTripId = null;

                    if (!tripId) return;

                    const trip = this.trips.find(t => t.id === tripId);
                    if (!trip || trip.status === newStatus) return;

                    // Проверка перехода в "Завершён"
                    if (newStatus === 'done') {
                        const detail = await window.API.api('/api/trips?action=get&id=' + tripId);
                        if (!detail.trip.fact_km || Number(detail.trip.fact_km) <= 0) {
                            alert('Заполните пробег факт перед завершением рейса');
                            return;
                        }
                        if (!detail.costs || detail.costs.length === 0) {
                            alert('Добавьте хотя бы одну затрату перед завершением рейса');
                            return;
                        }
                    }

                    const previousStatus = trip.status;
                    trip.status = newStatus;

                    try {
                        await window.API.api('/api/trips?action=update&id=' + tripId, {
                            method: 'PUT',
                            body: JSON.stringify({ status: newStatus })
                        });
                    } catch (e) {
                        trip.status = previousStatus;
                        alert('Ошибка: ' + e.message);
                    }
                },

                // ============ МОДАЛКА СОЗДАНИЯ ============

                openTripModal() {
                    this.tripModal = {
                        open: true,
                        saving: false,
                        error: '',
                        form: {
                            trip_date: new Date().toISOString().slice(0, 10),
                            trip_type: 'city',
                            
                            // Режим машины: own / hired
                            vehicle_mode: 'own',
                            vehicle_id: null,
                            hired_vehicle_info: '',
                            vehicle_volume: 0,
                            
                            // Режим водителя: own / hired
                            driver_mode: 'own',
                            driver_id: null,
                            hired_driver_info: '',
                            driver_rate: 0,
                            
                            route_id: null,
                            plan_km: 100,
                            revenue: 0,
                            comment: '',
                            addresses: [this.emptyAddress()]
                        }
                    };
                },

                closeTripModal() {
                    if (this.tripModal.saving) return;
                    this.tripModal.open = false;
                },

                emptyAddress() {
                    return {
                        external_id: '',
                        address: '',
                        contact_name: '',
                        phone: '',
                        volume: 0,
                        note: ''
                    };
                },

                addAddress() {
                    this.tripModal.form.addresses.push(this.emptyAddress());
                },

                removeAddress(index) {
                    this.tripModal.form.addresses.splice(index, 1);
                },

                setVehicleMode(mode) {
                    this.tripModal.form.vehicle_mode = mode;
                    // Сбрасываем противоположное
                    if (mode === 'own') {
                        this.tripModal.form.hired_vehicle_info = '';
                        this.tripModal.form.vehicle_volume = 0;
                    } else {
                        this.tripModal.form.vehicle_id = null;
                    }
                },

                setDriverMode(mode) {
                    this.tripModal.form.driver_mode = mode;
                    if (mode === 'own') {
                        this.tripModal.form.hired_driver_info = '';
                        this.tripModal.form.driver_rate = 0;
                    } else {
                        this.tripModal.form.driver_id = null;
                    }
                },

                onVehicleChange() {
                    // Ничего — геттер selectedVehicleVolume сам подтянет объём
                },

                onDriverChange() {
                    // Ничего
                },

                async saveTrip() {
                    this.tripModal.error = '';
                    const form = this.tripModal.form;

                    // Валидация
                    if (!form.trip_date) { this.tripModal.error = 'Укажите дату рейса'; return; }
                    
                    // Машина
                    if (form.vehicle_mode === 'own' && !form.vehicle_id) {
                        this.tripModal.error = 'Выберите машину';
                        return;
                    }
                    if (form.vehicle_mode === 'hired' && (!form.hired_vehicle_info || !form.hired_vehicle_info.trim())) {
                        this.tripModal.error = 'Укажите марку/госномер наёмной машины';
                        return;
                    }
                    if (form.vehicle_mode === 'hired' && !form.vehicle_volume) {
                        this.tripModal.error = 'Укажите объём наёмной машины';
                        return;
                    }

                    // Водитель
                    if (form.driver_mode === 'own' && !form.driver_id) {
                        this.tripModal.error = 'Выберите водителя';
                        return;
                    }
                    if (form.driver_mode === 'hired' && (!form.hired_driver_info || !form.hired_driver_info.trim())) {
                        this.tripModal.error = 'Укажите ФИО наёмного водителя';
                        return;
                    }

                    const validAddresses = form.addresses.filter(a => a.address && a.address.trim());
                    if (validAddresses.length === 0) {
                        this.tripModal.error = 'Добавьте хотя бы один адрес';
                        return;
                    }

                    this.tripModal.saving = true;

                    try {
                        const payload = {
                            trip_date: form.trip_date,
                            trip_type: form.trip_type,
                            route_id: form.route_id || null,
                            plan_km: form.plan_km || 0,
                            revenue: form.revenue || 0,
                            comment: form.comment || null,
                            addresses: validAddresses.map(a => ({
                                external_id: a.external_id || null,
                                address: a.address,
                                contact_name: a.contact_name || null,
                                phone: a.phone || null,
                                volume: Number(a.volume) || 0,
                                note: a.note || null
                            }))
                        };

                        // Машина
                        if (form.vehicle_mode === 'own') {
                            payload.vehicle_id = form.vehicle_id;
                        } else {
                            payload.hired_vehicle_info = form.hired_vehicle_info.trim();
                            payload.vehicle_volume = form.vehicle_volume;
                        }

                        // Водитель
                        if (form.driver_mode === 'own') {
                            payload.driver_id = form.driver_id;
                        } else {
                            payload.hired_driver_info = form.hired_driver_info.trim();
                            payload.driver_rate = form.driver_rate || 0;
                        }

                        await window.API.api('/api/trips', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });

                        this.tripModal.open = false;
                        await this.loadData();

                    } catch (e) {
                        this.tripModal.error = e.message;
                    } finally {
                        this.tripModal.saving = false;
                    }
                },

                logout() {
                    if (!confirm('Выйти из системы?')) return;
                    window.API.clearAuth();
                    window.location.href = '/login.html';
                }
            };
        }
    </script>
</body>
</html>
