    <script>
        function tripPage() {
            return {
                user: null,
                trip: null,
                orders: [],
                costs: [],
                autoCosts: [],
                vehicles: [],
                drivers: [],
                routes: [],
                loading: true,
                error: '',

                // Редактирование рейса
                editingTrip: false,
                editTripForm: {},
                savingTrip: false,
                showRevenue: false,

                // Модалки
                problemModal: { open: false, comment: '', saving: false, error: '' },
                resolveProblemModal: { open: false, newStatus: 'forming', saving: false, error: '' },
                cancelModal: { open: false, reason: '', orders_action: 'return_to_incoming', saving: false, error: '' },
                failedModal: { open: false, order: null, reason: '', saving: false, error: '' },
                // Модалки переноса
                moveOrderModal: { open: false, order: null, toTripId: null, saving: false, error: '', overloadWarning: '' },
                moveAllModal: { open: false, toTripId: null, reason: '', saving: false, error: '' },

                // Меню статуса доставки
                deliveryMenuOpenId: null,

                // Кеш списка рейсов для выбора
                availableTrips: [],

                // Затраты — inline редактирование
                editingCostId: null,
                editCostForm: {},
                newCostRow: false,
                newCostForm: {},
                savingCost: false,

                // Drag & drop состояние
                draggedOrderId: null,
                draggedOrderIndex: null,
                dragOverOrderIndex: null,
                reorderSaving: false,

                // Inline редактирование
                editingOrderId: null,
                editForm: {},
                savingEdit: false,

                // Добавление нового
                newOrderRow: false,
                newOrderForm: {},
                savingNewOrder: false,

                get userInitials() {
                    if (!this.user?.full_name) return '?';
                    return this.user.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                },

                get roleLabel() {
                    const roles = { 'admin': 'Администратор', 'senior_logist': 'Ст. логист', 'logist': 'Логист', 'manager': 'Руководитель', 'viewer': 'Наблюдатель' };
                    return roles[this.user?.role] || this.user?.role || '';
                },

                get statusLabel() {
                    const labels = {
                        'forming': 'Формируется', 'loading': 'Загрузка', 'transit': 'В пути',
                        'problem': 'Проблема', 'done': 'Завершён', 'cancelled': 'Отменён'
                    };
                    return labels[this.trip?.status] || this.trip?.status || '';
                },

                get vehicleVolume() {
                    return Number(this.trip?.vehicle_volume_at_time) || Number(this.trip?.vehicle_volume) || 0;
                },

                get totalVolume() {
                    const total = this.orders.reduce((sum, o) => sum + (Number(o.volume) || 0), 0);
                    return Math.round(total * 100) / 100;
                },

                get loadPercent() {
                    const cap = this.vehicleVolume;
                    if (!cap) return 0;
                    return Math.round(this.totalVolume / cap * 100);
                },

                get loadColor() {
                    if (this.totalVolume === 0) return 'load-empty';
                    const p = this.loadPercent;
                    if (p > 100) return 'load-overload';
                    if (p <= 30) return 'load-red';
                    if (p <= 60) return 'load-yellow';
                    return 'load-green';
                },

                get totalCostsManual() {
                    return this.costs.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
                },

                get totalCostsAuto() {
                    return this.autoCosts.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
                },

                get totalCostsAll() {
                    return this.totalCostsManual + this.totalCostsAuto;
                },

                get otherTrips() {
                    return this.availableTrips;
                },

                // Счётчики статусов доставки
                get deliveredCount() {
                    return this.orders.filter(o => o.delivery_status === 'delivered').length;
                },
                get failedCount() {
                    return this.orders.filter(o => o.delivery_status === 'failed').length;
                },
                get pendingCount() {
                    return this.orders.filter(o => !o.delivery_status || o.delivery_status === 'pending').length;
                },
                get cancelledCount() {
                    return this.orders.filter(o => o.delivery_status === 'cancelled').length;
                },

                async init() {
                    if (!window.AUTH) {
                        setTimeout(() => this.init(), 50);
                        return;
                    }
                    if (!window.AUTH.requireLogin()) return;
                    this.user = window.API.getUser();

                    try {
                        const settings = await window.API.api('/api/settings');
                        const setting = (settings.settings || []).find(s => s.key === 'show_revenue');
                        this.showRevenue = setting?.value === 'true';
                    } catch (e) {
                        this.showRevenue = false;
                    }

                    const params = new URLSearchParams(window.location.search);
                    const tripId = params.get('id');

                    if (!tripId) {
                        this.error = 'Не указан ID рейса';
                        this.loading = false;
                        return;
                    }

                    await this.loadTrip(tripId);
                },

                async loadTrip(tripId) {
                    this.loading = true;
                    this.error = '';
                    try {
                        const [tripData, vehicles, drivers, routes] = await Promise.all([
                            window.API.api('/api/trips?action=get&id=' + tripId),
                            window.API.api('/api/vehicles'),
                            window.API.api('/api/drivers'),
                            window.API.api('/api/routes')
                        ]);
                        this.trip = tripData.trip;
                        this.orders = tripData.orders || [];
                        this.costs = tripData.costs || [];
                        this.autoCosts = tripData.auto_costs || [];
                        this.vehicles = vehicles.vehicles || [];
                        this.drivers = drivers.drivers || [];
                        this.routes = routes.routes || [];
                        document.title = 'Рейс ' + this.trip.trip_number + ' · ЛогистПро';
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                // ============ СТАТУС ДОСТАВКИ ============

                deliveryStatusLabel(status) {
                    const labels = {
                        'pending': 'Ожидает',
                        'delivered': 'Доставлено',
                        'failed': 'Не доставлено',
                        'cancelled': 'Отменён'
                    };
                    return labels[status || 'pending'] || 'Ожидает';
                },

                openDeliveryMenu(order) {
                    // Не открываем, если рейс отменён — нечего менять
                    if (this.trip?.status === 'cancelled') return;
                    this.deliveryMenuOpenId = this.deliveryMenuOpenId === order.id ? null : order.id;
                },

                async setDeliveryStatus(order, status) {
                    this.deliveryMenuOpenId = null;

                    // Если failed — открываем модалку причины
                    if (status === 'failed') {
                        this.failedModal = {
                            open: true,
                            order: order,
                            reason: order.delivery_note || '',
                            saving: false,
                            error: ''
                        };
                        return;
                    }

                    await this.saveDeliveryStatus(order.id, status, null);
                },

                async submitFailedReason() {
                    this.failedModal.saving = true;
                    this.failedModal.error = '';

                    try {
                        await this.saveDeliveryStatus(
                            this.failedModal.order.id,
                            'failed',
                            this.failedModal.reason || null
                        );
                        this.failedModal.open = false;
                    } catch (e) {
                        this.failedModal.error = e.message;
                    } finally {
                        this.failedModal.saving = false;
                    }
                },

                closeFailedModal() {
                    if (this.failedModal.saving) return;
                    this.failedModal.open = false;
                },

                async saveDeliveryStatus(orderId, deliveryStatus, note) {
                    const body = { delivery_status: deliveryStatus };
                    if (note !== null && note !== undefined) body.delivery_note = note;

                    const data = await window.API.api('/api/orders?action=update-delivery-status&id=' + orderId, {
                        method: 'POST',
                        body: JSON.stringify(body)
                    });

                    // Обновляем локально
                    const order = this.orders.find(o => o.id === orderId);
                    if (order) {
                        order.delivery_status = data.order.delivery_status;
                        order.delivery_note = data.order.delivery_note;
                    }
                },

                async returnOrderToPool(order) {
                    if (!confirm('Вернуть заказ "' + order.address + '" в пул?')) return;

                    try {
                        await window.API.api('/api/orders?action=return-to-pool&id=' + order.id, {
                            method: 'POST'
                        });
                        this.orders = this.orders.filter(o => o.id !== order.id);
                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    }
                },

                async cancelOrder(order) {
                    if (!confirm('Отменить заказ "' + order.address + '"?')) return;

                    try {
                        await this.saveDeliveryStatus(order.id, 'cancelled', null);
                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    }
                },

                // ============ DRAG & DROP ============

                onDragStart(orderId, index) {
                    this.draggedOrderId = orderId;
                    this.draggedOrderIndex = index;
                },

                onDragOver(index) {
                    if (this.draggedOrderId === null) return;
                    this.dragOverOrderIndex = index;
                },

                onDragLeave(index) {
                    if (this.dragOverOrderIndex === index) {
                        this.dragOverOrderIndex = null;
                    }
                },

                async onDrop(targetIndex) {
                    const sourceIndex = this.draggedOrderIndex;
                    this.draggedOrderId = null;
                    this.draggedOrderIndex = null;
                    this.dragOverOrderIndex = null;

                    if (sourceIndex === null || sourceIndex === targetIndex) return;

                    const moved = this.orders.splice(sourceIndex, 1)[0];
                    this.orders.splice(targetIndex, 0, moved);

                    await this.saveOrder()
                },

                onDragEnd() {
                    this.draggedOrderId = null;
                    this.draggedOrderIndex = null;
                    this.dragOverOrderIndex = null;
                },

                // ============ КНОПКИ ВВЕРХ/ВНИЗ ============

                async moveUp(index) {
                    if (index === 0) return;
                    const moved = this.orders.splice(index, 1)[0];
                    this.orders.splice(index - 1, 0, moved);
                    await this.saveOrder();
                },

                async moveDown(index) {
                    if (index === this.orders.length - 1) return;
                    const moved = this.orders.splice(index, 1)[0];
                    this.orders.splice(index + 1, 0, moved);
                    await this.saveOrder();
                },

                async saveOrder() {
                    this.reorderSaving = true;
                    try {
                        const orderIds = this.orders.map(o => o.id);
                        await window.API.api('/api/trips?action=reorder&id=' + this.trip.id, {
                            method: 'POST',
                            body: JSON.stringify({ order_ids: orderIds })
                        });
                    } catch (e) {
                        alert('Ошибка сохранения порядка: ' + e.message);
                        await this.loadTrip(this.trip.id);
                    } finally {
                        this.reorderSaving = false;
                    }
                },

                // ============ INLINE РЕДАКТИРОВАНИЕ ============

                startEdit(order) {
                    this.editingOrderId = order.id;
                    this.editForm = {
                        external_id: order.external_id || '',
                        address: order.address,
                        contact_name: order.contact_name || '',
                        phone: order.phone || '',
                        volume: order.volume || 0,
                        note: order.note || ''
                    };
                },

                cancelEdit() {
                    this.editingOrderId = null;
                    this.editForm = {};
                },

                async saveEdit() {
                    if (!this.editForm.address || !this.editForm.address.trim()) {
                        alert('Адрес обязателен');
                        return;
                    }

                    this.savingEdit = true;
                    try {
                        await window.API.api('/api/orders?action=update&id=' + this.editingOrderId, {
                            method: 'PUT',
                            body: JSON.stringify({
                                external_id: this.editForm.external_id || null,
                                address: this.editForm.address.trim(),
                                contact_name: this.editForm.contact_name || null,
                                phone: this.editForm.phone || null,
                                volume: Number(this.editForm.volume) || 0,
                                note: this.editForm.note || null
                            })
                        });

                        const order = this.orders.find(o => o.id === this.editingOrderId);
                        if (order) {
                            order.external_id = this.editForm.external_id || null;
                            order.address = this.editForm.address.trim();
                            order.contact_name = this.editForm.contact_name || null;
                            order.phone = this.editForm.phone || null;
                            order.volume = Number(this.editForm.volume) || 0;
                            order.note = this.editForm.note || null;
                        }

                        this.editingOrderId = null;
                        this.editForm = {};
                    } catch (e) {
                        alert('Ошибка сохранения: ' + e.message);
                    } finally {
                        this.savingEdit = false;
                    }
                },

                // ============ ДОБАВЛЕНИЕ ============

                addNewOrder() {
                    this.newOrderRow = true;
                    this.newOrderForm = {
                        external_id: '',
                        address: '',
                        contact_name: '',
                        phone: '',
                        volume: 0,
                        note: ''
                    };
                },

                cancelNewOrder() {
                    this.newOrderRow = false;
                    this.newOrderForm = {};
                },

                async saveNewOrder() {
                    if (!this.newOrderForm.address || !this.newOrderForm.address.trim()) {
                        alert('Адрес обязателен');
                        return;
                    }

                    this.savingNewOrder = true;
                    try {
                        const data = await window.API.api('/api/orders?action=create', {
                            method: 'POST',
                            body: JSON.stringify({
                                trip_id: this.trip.id,
                                external_id: this.newOrderForm.external_id || null,
                                address: this.newOrderForm.address.trim(),
                                contact_name: this.newOrderForm.contact_name || null,
                                phone: this.newOrderForm.phone || null,
                                volume: Number(this.newOrderForm.volume) || 0,
                                note: this.newOrderForm.note || null
                            })
                        });

                        this.orders.push(data.order);
                        this.newOrderRow = false;
                        this.newOrderForm = {};

                    } catch (e) {
                        alert('Ошибка добавления: ' + e.message);
                    } finally {
                        this.savingNewOrder = false;
                    }
                },

                // ============ УДАЛЕНИЕ ============

                async deleteOrder(order) {
                    if (!confirm('Удалить адрес "' + order.address + '"?')) return;

                    try {
                        await window.API.api('/api/orders?action=delete&id=' + order.id, {
                            method: 'DELETE'
                        });

                        this.orders = this.orders.filter(o => o.id !== order.id);
                    } catch (e) {
                        alert('Ошибка удаления: ' + e.message);
                    }
                },

                // ============ ХЕЛПЕРЫ ============

                formatDate(d) {
                    if (!d) return '—';
                    return window.HELPERS.formatDate(d);
                },

                formatMoney(v) {
                    return window.HELPERS.formatMoney(v);
                },

                categoryLabel(cat) {
                    const labels = {
                        'salary': 'Зарплата',
                        'hired': 'Наёмный транспорт',
                        'amort': 'Амортизация',
                        'fuel': 'Топливо',
                        'toll': 'Платные дороги',
                        'repair': 'Ремонт',
                        'fine': 'Штрафы',
                        'other': 'Прочее'
                    };
                    return labels[cat] || cat;
                },

                // ============ ЗАТРАТЫ ============

                addNewCost() {
                    this.newCostRow = true;
                    this.newCostForm = {
                        category: 'fuel',
                        amount: 0,
                        note: ''
                    };
                },

                cancelNewCost() {
                    this.newCostRow = false;
                    this.newCostForm = {};
                },

                async saveNewCost() {
                    if (!this.newCostForm.amount || Number(this.newCostForm.amount) <= 0) {
                        alert('Введите сумму');
                        return;
                    }

                    this.savingCost = true;
                    try {
                        const data = await window.API.api('/api/costs?action=create', {
                            method: 'POST',
                            body: JSON.stringify({
                                trip_id: this.trip.id,
                                category: this.newCostForm.category,
                                amount: Number(this.newCostForm.amount),
                                note: this.newCostForm.note || null
                            })
                        });

                        this.costs.unshift(data.cost);
                        this.newCostRow = false;
                        this.newCostForm = {};

                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    } finally {
                        this.savingCost = false;
                    }
                },

                startEditCost(cost) {
                    this.editingCostId = cost.id;
                    this.editCostForm = {
                        category: cost.category,
                        amount: cost.amount,
                        note: cost.note || ''
                    };
                },

                cancelEditCost() {
                    this.editingCostId = null;
                    this.editCostForm = {};
                },

                async saveEditCost() {
                    if (Number(this.editCostForm.amount) <= 0) {
                        alert('Сумма должна быть положительной');
                        return;
                    }

                    this.savingCost = true;
                    try {
                        const data = await window.API.api('/api/costs?action=update&id=' + this.editingCostId, {
                            method: 'PUT',
                            body: JSON.stringify({
                                category: this.editCostForm.category,
                                amount: Number(this.editCostForm.amount),
                                note: this.editCostForm.note || null
                            })
                        });

                        const cost = this.costs.find(c => c.id === this.editingCostId);
                        if (cost) {
                            cost.category = data.cost.category;
                            cost.amount = data.cost.amount;
                            cost.note = data.cost.note;
                        }

                        this.editingCostId = null;
                        this.editCostForm = {};

                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    } finally {
                        this.savingCost = false;
                    }
                },

                async deleteCost(cost) {
                    if (!confirm('Удалить затрату "' + this.categoryLabel(cost.category) + '" на ' + this.formatMoney(cost.amount) + '?')) return;

                    try {
                        await window.API.api('/api/costs?action=delete&id=' + cost.id, {
                            method: 'DELETE'
                        });

                        this.costs = this.costs.filter(c => c.id !== cost.id);

                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    }
                },

                // ============ РЕДАКТИРОВАНИЕ РЕЙСА ============

                startEditTrip() {
                    this.editingTrip = true;
                    this.editTripForm = {
                        trip_date: this.trip.trip_date ? this.trip.trip_date.substring(0, 10) : '',
                        trip_type: this.trip.trip_type,
                        
                        vehicle_mode: this.trip.hired_vehicle_info ? 'hired' : 'own',
                        vehicle_id: this.trip.vehicle_id,
                        hired_vehicle_info: this.trip.hired_vehicle_info || '',
                        vehicle_volume: Number(this.trip.vehicle_volume_at_time) || 0,
                        
                        driver_mode: this.trip.hired_driver_info ? 'hired' : 'own',
                        driver_id: this.trip.driver_id,
                        hired_driver_info: this.trip.hired_driver_info || '',
                        
                        route_id: this.trip.route_id || null,
                        plan_km: Number(this.trip.plan_km) || 0,
                        fact_km: Number(this.trip.fact_km) || 0,
                        driver_rate_at_time: Number(this.trip.driver_rate_at_time) || 0,
                        revenue: Number(this.trip.revenue) || 0,
                        comment: this.trip.comment || ''
                    };
                },

                setEditVehicleMode(mode) {
                    this.editTripForm.vehicle_mode = mode;
                    if (mode === 'own') {
                        this.editTripForm.hired_vehicle_info = '';
                    } else {
                        this.editTripForm.vehicle_id = null;
                    }
                },

                setEditDriverMode(mode) {
                    this.editTripForm.driver_mode = mode;
                    if (mode === 'own') {
                        this.editTripForm.hired_driver_info = '';
                    } else {
                        this.editTripForm.driver_id = null;
                    }
                },

                cancelEditTrip() {
                    this.editingTrip = false;
                    this.editTripForm = {};
                },

                async saveTrip() {
                    if (!this.editTripForm.trip_date) {
                        alert('Укажите дату рейса');
                        return;
                    }

                    const form = this.editTripForm;
                    const payload = {
                        trip_date: form.trip_date,
                        trip_type: form.trip_type,
                        route_id: form.route_id,
                        plan_km: form.plan_km,
                        fact_km: form.fact_km,
                        driver_rate_at_time: form.driver_rate_at_time,
                        revenue: form.revenue,
                        comment: form.comment || null
                    };

                    if (form.vehicle_mode === 'own') {
                        payload.vehicle_id = form.vehicle_id;
                    } else {
                        payload.vehicle_id = null;
                        payload.hired_vehicle_info = form.hired_vehicle_info;
                        payload.vehicle_volume_at_time = form.vehicle_volume;
                    }

                    if (form.driver_mode === 'own') {
                        payload.driver_id = form.driver_id;
                    } else {
                        payload.driver_id = null;
                        payload.hired_driver_info = form.hired_driver_info;
                    }

                    this.savingTrip = true;
                    try {
                        await window.API.api('/api/trips?action=update&id=' + this.trip.id, {
                            method: 'PUT',
                            body: JSON.stringify(payload)
                        });

                        await this.loadTrip(this.trip.id);
                        this.editingTrip = false;
                        this.editTripForm = {};

                    } catch (e) {
                        alert('Ошибка сохранения: ' + e.message);
                    } finally {
                        this.savingTrip = false;
                    }
                },

                // ============ ПРОБЛЕМА ============

                openProblemModal() {
                    this.problemModal = {
                        open: true,
                        comment: '',
                        saving: false,
                        error: ''
                    };
                },

                async submitProblem() {
                    if (!this.problemModal.comment.trim()) {
                        this.problemModal.error = 'Опишите проблему';
                        return;
                    }

                    this.problemModal.saving = true;
                    this.problemModal.error = '';

                    try {
                        await window.API.api('/api/trips?action=problem&id=' + this.trip.id, {
                            method: 'POST',
                            body: JSON.stringify({ comment: this.problemModal.comment.trim() })
                        });

                        this.problemModal.open = false;
                        await this.loadTrip(this.trip.id);

                    } catch (e) {
                        this.problemModal.error = e.message;
                    } finally {
                        this.problemModal.saving = false;
                    }
                },

                // ============ РЕШЕНА ПРОБЛЕМА ============

                openResolveProblemModal() {
                    this.resolveProblemModal = {
                        open: true,
                        newStatus: 'forming',
                        saving: false,
                        error: ''
                    };
                },

                closeResolveProblemModal() {
                    if (this.resolveProblemModal.saving) return;
                    this.resolveProblemModal.open = false;
                },

                async submitResolveProblem() {
                    this.resolveProblemModal.error = '';
                    this.resolveProblemModal.saving = true;

                    try {
                        await window.API.api('/api/trips?action=update&id=' + this.trip.id, {
                            method: 'PUT',
                            body: JSON.stringify({
                                status: this.resolveProblemModal.newStatus
                            })
                        });

                        this.resolveProblemModal.open = false;
                        await this.loadTrip(this.trip.id);

                    } catch (e) {
                        this.resolveProblemModal.error = e.message;
                    } finally {
                        this.resolveProblemModal.saving = false;
                    }
                },

                // ============ ОТМЕНА ============

                openCancelModal() {
                    this.cancelModal = {
                        open: true,
                        reason: '',
                        orders_action: 'return_to_incoming',
                        saving: false,
                        error: ''
                    };
                },

                async submitCancel() {
                    if (!this.cancelModal.reason.trim()) {
                        this.cancelModal.error = 'Укажите причину отмены';
                        return;
                    }

                    if (!confirm('Отменить рейс ' + this.trip.trip_number + '?')) return;

                    this.cancelModal.saving = true;
                    this.cancelModal.error = '';

                    try {
                        await window.API.api('/api/trips?action=cancel&id=' + this.trip.id, {
                            method: 'POST',
                            body: JSON.stringify({
                                reason: this.cancelModal.reason.trim(),
                                orders_action: this.cancelModal.orders_action
                            })
                        });

                        this.cancelModal.open = false;
                        await this.loadTrip(this.trip.id);

                    } catch (e) {
                        this.cancelModal.error = e.message;
                    } finally {
                        this.cancelModal.saving = false;
                    }
                },

                // ============ УДАЛЕНИЕ ============

                async deleteTrip() {
                    if (!confirm('Удалить рейс ' + this.trip.trip_number + '?\n\nВсе адреса и затраты этого рейса также будут удалены.')) return;

                    try {
                        await window.API.api('/api/trips?action=delete&id=' + this.trip.id, {
                            method: 'DELETE'
                        });
                        window.location.href = '/';
                    } catch (e) {
                        alert('Ошибка удаления: ' + e.message);
                    }
                },

                // ============ ПУТЕВОЙ ЛИСТ ============

                printWaybill() {
                    window.print();
                },

                // ============ ПЕРЕНОС ОДНОГО ЗАКАЗА ============

                async openMoveOrderModal(order) {
                    this.moveOrderModal = {
                        open: true,
                        order: order,
                        toTripId: null,
                        saving: false,
                        error: '',
                        overloadWarning: ''
                    };

                    await this.loadAvailableTrips();
                },

                closeMoveOrderModal() {
                    if (this.moveOrderModal.saving) return;
                    this.moveOrderModal.open = false;
                    this.moveOrderModal.order = null;
                },

                selectTargetTrip(trip) {
                    this.moveOrderModal.toTripId = trip.id;
                    
                    const orderVolume = Number(this.moveOrderModal.order?.volume) || 0;
                    const currentVolume = Number(trip.total_volume) || 0;
                    const capacity = Number(trip.vehicle_volume_at_time) || Number(trip.vehicle_volume) || 0;
                    const newVolume = currentVolume + orderVolume;
                    
                    if (capacity > 0 && newVolume > capacity) {
                        this.moveOrderModal.overloadWarning = 
                            'Превышение объёма: ' + newVolume.toFixed(1) + ' м³ из ' + capacity + ' м³. ' +
                            'Рейс будет перегружен на ' + (newVolume - capacity).toFixed(1) + ' м³.';
                    } else {
                        this.moveOrderModal.overloadWarning = '';
                    }
                },

                async submitMoveOrder() {
                    if (!this.moveOrderModal.toTripId) {
                        this.moveOrderModal.error = 'Выберите рейс';
                        return;
                    }

                    this.moveOrderModal.saving = true;
                    this.moveOrderModal.error = '';

                    try {
                        await window.API.api('/api/orders?action=move&id=' + this.moveOrderModal.order.id, {
                            method: 'POST',
                            body: JSON.stringify({
                                to_trip_id: this.moveOrderModal.toTripId,
                                reason: 'Перенос из карточки рейса'
                            })
                        });

                        this.orders = this.orders.filter(o => o.id !== this.moveOrderModal.order.id);

                        this.moveOrderModal.open = false;
                        this.moveOrderModal.order = null;

                    } catch (e) {
                        this.moveOrderModal.error = e.message;
                    } finally {
                        this.moveOrderModal.saving = false;
                    }
                },

                // ============ ПЕРЕНОС ВСЕХ ЗАКАЗОВ ============

                async openMoveAllModal() {
                    if (this.orders.length === 0) return;

                    this.moveAllModal = {
                        open: true,
                        toTripId: null,
                        reason: '',
                        saving: false,
                        error: ''
                    };

                    await this.loadAvailableTrips();
                },

                closeMoveAllModal() {
                    if (this.moveAllModal.saving) return;
                    this.moveAllModal.open = false;
                },

                selectTargetTripAll(trip) {
                    this.moveAllModal.toTripId = trip.id;
                },

                async submitMoveAll() {
                    if (!this.moveAllModal.toTripId) {
                        this.moveAllModal.error = 'Выберите рейс';
                        return;
                    }

                    if (!confirm('Перенести ВСЕ заказы (' + this.orders.length + ') в выбранный рейс?')) return;

                    this.moveAllModal.saving = true;
                    this.moveAllModal.error = '';

                    try {
                        const result = await window.API.api('/api/trips?action=move-all-orders&id=' + this.trip.id, {
                            method: 'POST',
                            body: JSON.stringify({
                                to_trip_id: this.moveAllModal.toTripId,
                                reason: this.moveAllModal.reason || null
                            })
                        });

                        this.orders = [];
                        this.moveAllModal.open = false;

                        alert(result.message || 'Заказы перенесены');

                    } catch (e) {
                        this.moveAllModal.error = e.message;
                    } finally {
                        this.moveAllModal.saving = false;
                    }
                },

                // ============ ЗАГРУЗКА СПИСКА РЕЙСОВ ДЛЯ ПЕРЕНОСА ============

                async loadAvailableTrips() {
                    try {
                        const data = await window.API.api('/api/trips');
                        this.availableTrips = (data.trips || []).filter(t => 
                            t.id !== this.trip.id && 
                            t.status !== 'done' && 
                            t.status !== 'cancelled'
                        );
                    } catch (e) {
                        console.error('Ошибка загрузки рейсов:', e);
                        this.availableTrips = [];
                    }
                },

                goBack() {
                    window.location.href = '/';
                },

                logout() {
                    if (!confirm('Выйти из системы?')) return;
                    window.API.clearAuth();
                    window.location.href = '/login.html';
                }
            };
        }
    </script>
</body>
</html>
