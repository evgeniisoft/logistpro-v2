<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейс · ЛогистПро</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/mask@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="tripPage()" x-init="$nextTick(() => init())">

    <header class="app-header">
        <div class="app-header-left">
            <a href="/" class="app-logo">
                <span class="app-logo-mark">LP</span>
                <span>ЛогистПро</span>
            </a>
            <nav class="app-nav">
                <a href="/" class="app-nav-link">Рейсы</a>
                <a href="/incoming.html" class="app-nav-link">Входящие</a>
                <a href="/reports.html" class="app-nav-link">Отчёты</a>
                <a href="/references.html" class="app-nav-link">Справочники</a>
                <a href="/journal.html" class="app-nav-link">Журнал</a>
            </nav>
        </div>
        <div class="app-header-right">
            <div class="user-badge">
                <div class="user-avatar" x-text="userInitials"></div>
                <div>
                    <div x-text="user?.full_name || ''" style="font-weight:500;"></div>
                    <div x-text="roleLabel" style="font-size:11px;opacity:0.7;"></div>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" @click="logout()" style="color:rgba(255,255,255,0.85);" title="Выйти">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div class="container">

            <!-- Загрузка -->
            <div x-show="loading" class="skeleton" style="height:400px;"></div>

            <!-- Ошибка -->
            <div x-show="error && !loading" x-cloak class="alert alert-error" x-text="error"></div>

            <!-- Контент -->
            <template x-if="!loading && !error && trip">
                <div>

                <!-- Шапка страницы -->
                <div class="trip-page-header">
                    <a href="/" class="back-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        К доске
                    </a>
                    <h1 class="trip-page-title">
                        <span x-text="'Рейс ' + trip.trip_number"></span>
                        <span class="trip-status-badge" :class="'trip-status-' + trip.status" x-text="statusLabel"></span>
                    </h1>
                </div>

                <!-- Информация о рейсе -->
                <div class="info-card">
                    <template x-if="!editingTrip">
                        <div>
                            <div class="info-grid">
                                <div class="info-item">
                                    <div class="info-item-label">Дата</div>
                                    <div class="info-item-value" x-text="formatDate(trip.trip_date)"></div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Тип рейса</div>
                                    <div class="info-item-value" x-text="trip.trip_type === 'city' ? 'Городской' : 'Междугородний'"></div>
                                </div>
                                
                                <!-- Машина -->
                                <div class="info-item">
                                    <div class="info-item-label">Машина</div>
                                    <template x-if="trip.hired_vehicle_info">
                                        <div>
                                            <div class="info-item-value">
                                                <span x-text="trip.hired_vehicle_info"></span>
                                                <span class="type-badge type-badge-hired">Наёмная</span>
                                            </div>
                                            <div class="info-item-sub" x-text="(trip.vehicle_volume_at_time || '?') + ' м³'"></div>
                                        </div>
                                    </template>
                                    <template x-if="!trip.hired_vehicle_info">
                                        <div>
                                            <div class="info-item-value">
                                                <span x-text="trip.vehicle_plate || '—'"></span>
                                                <span class="type-badge type-badge-own">Своя</span>
                                            </div>
                                            <div class="info-item-sub" x-text="trip.vehicle_model || ''"></div>
                                        </div>
                                    </template>
                                </div>
                                
                                <!-- Водитель -->
                                <div class="info-item">
                                    <div class="info-item-label">Водитель</div>
                                    <template x-if="trip.hired_driver_info">
                                        <div>
                                            <div class="info-item-value">
                                                <span x-text="trip.hired_driver_info"></span>
                                                <span class="type-badge type-badge-hired">Наёмный</span>
                                            </div>
                                            <div class="info-item-sub" x-text="trip.driver_rate_at_time ? formatMoney(trip.driver_rate_at_time) : ''"></div>
                                        </div>
                                    </template>
                                    <template x-if="!trip.hired_driver_info">
                                        <div>
                                            <div class="info-item-value">
                                                <span x-text="trip.driver_name || '—'"></span>
                                                <span class="type-badge type-badge-own">Свой</span>
                                            </div>
                                            <div class="info-item-sub" x-text="trip.driver_rate_at_time ? formatMoney(trip.driver_rate_at_time) : ''"></div>
                                        </div>
                                    </template>
                                </div>

                                <div class="info-item">
                                    <div class="info-item-label">Пробег план</div>
                                    <div class="info-item-value" x-text="(trip.plan_km || 0) + ' км'"></div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Пробег факт</div>
                                    <div class="info-item-value" x-text="(trip.fact_km || 0) + ' км'"></div>
                                </div>
                                <div class="info-item">
                                    <div class="info-item-label">Ставка за рейс</div>
                                    <div class="info-item-value" x-text="formatMoney(trip.driver_rate_at_time)"></div>
                                </div>
                                
                                <!-- Выручка — только если включена -->
                                <div class="info-item" x-show="showRevenue">
                                    <div class="info-item-label">Выручка</div>
                                    <div class="info-item-value" x-text="formatMoney(trip.revenue)"></div>
                                </div>
                            </div>

                            <div x-show="trip.comment" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border-light);">
                                <div class="info-item-label">Комментарий</div>
                                <div style="font-size:13px;color:var(--text-primary);margin-top:4px;" x-text="trip.comment"></div>
                            </div>
                            <div x-show="trip.status === 'problem' && trip.problem_comment" style="margin-top:20px;padding:12px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;">
                                <div style="font-size:11px;font-weight:600;color:#991B1B;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Проблема</div>
                                <div style="font-size:13px;color:#991B1B;" x-text="trip.problem_comment"></div>
                            </div>
                            <div x-show="trip.status === 'cancelled' && trip.cancel_reason" style="margin-top:20px;padding:12px 14px;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:8px;">
                                <div style="font-size:11px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Причина отмены</div>
                                <div style="font-size:13px;color:#6B7280;" x-text="trip.cancel_reason"></div>
                            </div>
                        </div>
                    </template>

                    <!-- Режим редактирования -->
                    <template x-if="editingTrip">
                        <div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Дата рейса</label>
                                    <input type="date" class="form-input" x-model="editTripForm.trip_date">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Тип рейса</label>
                                    <select class="form-input" x-model="editTripForm.trip_type">
                                        <option value="city">Городской</option>
                                        <option value="intercity">Междугородний</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Машина -->
                            <div class="form-group">
                                <label class="form-label">Машина</label>
                                <div class="type-switch">
                                    <button type="button" class="type-switch-btn" :class="editTripForm.vehicle_mode === 'own' ? 'active' : ''" @click="setEditVehicleMode('own')">
                                        Своя
                                    </button>
                                    <button type="button" class="type-switch-btn" :class="editTripForm.vehicle_mode === 'hired' ? 'active' : ''" @click="setEditVehicleMode('hired')">
                                        Наёмная
                                    </button>
                                </div>
                            </div>

                            <template x-if="editTripForm.vehicle_mode === 'own'">
                                <div class="form-group">
                                    <select class="form-input" x-model.number="editTripForm.vehicle_id">
                                        <option :value="null">— Выберите машину —</option>
                                        <template x-for="v in vehicles" :key="v.id">
                                            <option :value="v.id" x-text="v.plate + ' · ' + (v.model || '') + ' · ' + (v.volume || '?') + ' м³'"></option>
                                        </template>
                                    </select>
                                </div>
                            </template>

                            <template x-if="editTripForm.vehicle_mode === 'hired'">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Марка / госномер</label>
                                        <input type="text" class="form-input" x-model="editTripForm.hired_vehicle_info" placeholder="Газель А123ВС">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Объём, м³</label>
                                        <input type="number" class="form-input" x-model.number="editTripForm.vehicle_volume" step="0.1" min="0">
                                    </div>
                                </div>
                            </template>

                            <!-- Водитель -->
                            <div class="form-group">
                                <label class="form-label">Водитель</label>
                                <div class="type-switch">
                                    <button type="button" class="type-switch-btn" :class="editTripForm.driver_mode === 'own' ? 'active' : ''" @click="setEditDriverMode('own')">
                                        Свой
                                    </button>
                                    <button type="button" class="type-switch-btn" :class="editTripForm.driver_mode === 'hired' ? 'active' : ''" @click="setEditDriverMode('hired')">
                                        Наёмный
                                    </button>
                                </div>
                            </div>

                            <template x-if="editTripForm.driver_mode === 'own'">
                                <div class="form-group">
                                    <select class="form-input" x-model.number="editTripForm.driver_id">
                                        <option :value="null">— Выберите водителя —</option>
                                        <template x-for="d in drivers" :key="d.id">
                                            <option :value="d.id" x-text="d.full_name + ' · ' + (d.default_rate || 0) + ' ₽'"></option>
                                        </template>
                                    </select>
                                </div>
                            </template>

                            <template x-if="editTripForm.driver_mode === 'hired'">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">ФИО водителя</label>
                                        <input type="text" class="form-input" x-model="editTripForm.hired_driver_info" placeholder="Петров П.П.">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Ставка, ₽</label>
                                        <input type="number" class="form-input" x-model.number="editTripForm.driver_rate_at_time" min="0">
                                    </div>
                                </div>
                            </template>

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Пробег план, км</label>
                                    <input type="number" class="form-input" x-model.number="editTripForm.plan_km" min="0">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Пробег факт, км</label>
                                    <input type="number" class="form-input" x-model.number="editTripForm.fact_km" min="0">
                                </div>
                                <template x-if="editTripForm.driver_mode === 'own'">
                                    <div class="form-group">
                                        <label class="form-label">Ставка за рейс, ₽</label>
                                        <input type="number" class="form-input" x-model.number="editTripForm.driver_rate_at_time" min="0">
                                    </div>
                                </template>
                                <template x-if="showRevenue">
                                    <div class="form-group">
                                        <label class="form-label">Выручка, ₽</label>
                                        <input type="number" class="form-input" x-model.number="editTripForm.revenue" min="0">
                                    </div>
                                </template>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Комментарий</label>
                                <input type="text" class="form-input" x-model="editTripForm.comment" placeholder="Необязательно">
                            </div>

                            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
                                <button class="btn btn-secondary" @click="cancelEditTrip()" :disabled="savingTrip">Отмена</button>
                                <button class="btn btn-primary" @click="saveTrip()" :disabled="savingTrip">
                                    <span x-show="!savingTrip">Сохранить</span>
                                    <span x-show="savingTrip" x-cloak>Сохранение...</span>
                                </button>
                            </div>
                        </div>
                    </template>

                    <!-- Загрузка -->
                    <div class="trip-load-block">
                        <div class="trip-load-info">
                            <span>Загрузка: <strong x-text="totalVolume + ' м³'"></strong> из <strong x-text="vehicleVolume + ' м³'"></strong></span>
                            <span><strong x-text="loadPercent + '%'"></strong></span>
                        </div>
                        <div class="load-bar">
                            <div class="load-bar-fill" :class="loadColor" :style="'width:' + Math.min(loadPercent, 100) + '%'"></div>
                        </div>
                    </div>
                </div>

                <!-- Адреса доставки -->
                <div class="section-card">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            Адреса доставки
                            <span style="font-weight:400;color:var(--text-secondary);font-size:13px;margin-left:8px;"
                                x-text="'(' + orders.length + ')'"></span>
                        </h2>
                        <div class="section-card-actions">
                            <button class="btn btn-secondary btn-sm" @click="addNewOrder()" :disabled="reorderSaving || editingOrderId">
                                + Добавить адрес
                            </button>
                            <button class="btn btn-secondary btn-sm" disabled title="Будет добавлено на следующем этапе">
                                + Из входящих
                            </button>
                            <template x-if="orders.length > 0 && trip.status !== 'done' && trip.status !== 'cancelled'">
                                <button class="btn btn-secondary btn-sm" @click="openMoveAllModal()" :disabled="reorderSaving">
                                    Перенести все
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Сводка по статусам -->
                    <div x-show="orders.length > 0" style="padding:10px 20px;border-bottom:1px solid var(--border-light);font-size:12px;color:var(--text-secondary);display:flex;gap:16px;flex-wrap:wrap;">
                        <span>Доставлено: <strong style="color:#059669;" x-text="deliveredCount"></strong></span>
                        <span>Не доставлено: <strong style="color:#DC2626;" x-text="failedCount"></strong></span>
                        <span>Ожидает: <strong x-text="pendingCount"></strong></span>
                        <template x-if="cancelledCount > 0">
                            <span>Отменено: <strong style="color:#6B7280;" x-text="cancelledCount"></strong></span>
                        </template>
                    </div>
                
                    <div x-show="orders.length === 0 && !newOrderRow"
                        style="padding:40px;text-align:center;color:var(--text-secondary);font-size:13px;">
                        В рейсе пока нет адресов
                    </div>
                
                    <div x-show="orders.length > 0 || newOrderRow" style="overflow-x:auto;">
                        <table class="address-table">
                            <thead>
                                <tr>
                                    <th class="col-seq">№</th>
                                    <th class="col-id">ID заказа</th>
                                    <th class="col-address">Адрес</th>
                                    <th class="col-contact">Контакт</th>
                                    <th class="col-phone">Телефон</th>
                                    <th class="col-volume text-right">м³</th>
                                    <th class="col-status">Статус</th>
                                    <th class="col-note">Примечание</th>
                                    <th class="col-actions">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Существующие заказы -->
                                <template x-for="(order, index) in orders" :key="order.id">
                                    <template x-if="true">
                                        <tr :class="{
                                            'dragging': draggedOrderId === order.id,
                                            'drag-over': dragOverOrderIndex === index && draggedOrderId !== order.id,
                                            'row-editing': editingOrderId === order.id
                                        }" :draggable="editingOrderId !== order.id && !reorderSaving"
                                            @dragstart="onDragStart(order.id, index)" @dragover.prevent="onDragOver(index)"
                                            @dragleave="onDragLeave(index)" @drop.prevent="onDrop(index)" @dragend="onDragEnd()">
                    
                                            <!-- Режим просмотра -->
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-seq-with-handle">
                                                    <span class="drag-handle" title="Перетащите для изменения порядка">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <circle cx="9" cy="6" r="1"></circle>
                                                            <circle cx="9" cy="12" r="1"></circle>
                                                            <circle cx="9" cy="18" r="1"></circle>
                                                            <circle cx="15" cy="6" r="1"></circle>
                                                            <circle cx="15" cy="12" r="1"></circle>
                                                            <circle cx="15" cy="18" r="1"></circle>
                                                        </svg>
                                                    </span>
                                                    <span class="seq-number" x-text="index + 1"></span>
                                                </td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-seq">
                                                    <span x-text="index + 1"></span>
                                                </td>
                                            </template>
                    
                                            <!-- Просмотр/редактирование -->
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-id">
                                                    <span x-text="order.external_id || ('#' + order.id)"></span>
                                                </td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-id">
                                                    <input type="text" x-model="editForm.external_id" placeholder="#12345">
                                                </td>
                                            </template>
                    
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-address" x-text="order.address"></td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-address">
                                                    <input type="text" x-model="editForm.address" placeholder="ул. Ленина, 15">
                                                </td>
                                            </template>
                    
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-contact" x-text="order.contact_name || '—'"></td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-contact">
                                                    <input type="text" x-model="editForm.contact_name" placeholder="Иванов И.И.">
                                                </td>
                                            </template>
                    
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-phone" x-text="order.phone || '—'"></td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-phone">
                                                    <input type="text" class="addr-phone" x-model="editForm.phone" x-mask="+7 (999) 999-99-99">
                                                </td>
                                            </template>
                    
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-volume" x-text="order.volume || '—'"></td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-volume">
                                                    <input type="number" x-model.number="editForm.volume" step="0.1" min="0">
                                                </td>
                                            </template>

                                            <!-- СТАТУС ДОСТАВКИ -->
                                            <td class="col-status">
                                                <div style="position:relative;">
                                                    <span class="delivery-badge" 
                                                        :class="'delivery-' + (order.delivery_status || 'pending')"
                                                        @click="openDeliveryMenu(order)"
                                                        :title="order.delivery_note || deliveryStatusLabel(order.delivery_status)"
                                                        x-text="deliveryStatusLabel(order.delivery_status)">
                                                    </span>
                                                    <!-- Меню -->
                                                    <div x-show="deliveryMenuOpenId === order.id" x-cloak 
                                                        class="delivery-menu"
                                                        @click.away="deliveryMenuOpenId = null">
                                                        <button type="button" class="delivery-menu-item" @click="setDeliveryStatus(order, 'pending')">
                                                            <span class="delivery-badge delivery-pending">Ожидает</span>
                                                        </button>
                                                        <button type="button" class="delivery-menu-item" @click="setDeliveryStatus(order, 'delivered')">
                                                            <span class="delivery-badge delivery-delivered">Доставлено</span>
                                                        </button>
                                                        <button type="button" class="delivery-menu-item" @click="setDeliveryStatus(order, 'failed')">
                                                            <span class="delivery-badge delivery-failed">Не доставлено</span>
                                                        </button>
                                                        <button type="button" class="delivery-menu-item" @click="setDeliveryStatus(order, 'cancelled')">
                                                            <span class="delivery-badge delivery-cancelled">Отменён</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </td>
                    
                                            <template x-if="editingOrderId !== order.id">
                                                <td class="col-note">
                                                    <template x-if="order.note">
                                                        <span class="addr-note-preview" :title="order.note" x-text="order.note"></span>
                                                    </template>
                                                    <template x-if="!order.note">
                                                        <span style="color:var(--text-muted);">—</span>
                                                    </template>
                                                </td>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <td class="col-note">
                                                    <textarea x-model="editForm.note" placeholder="Примечание"></textarea>
                                                </td>
                                            </template>
                    
                                            <!-- Действия -->
                                            <td class="col-actions">
                                                <template x-if="editingOrderId !== order.id">
                                                    <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                        <button class="btn-action" @click="moveUp(index)"
                                                            :disabled="index === 0 || reorderSaving" title="Выше">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                                                <polyline points="5 12 12 5 19 12"></polyline>
                                                            </svg>
                                                        </button>
                                                        <button class="btn-action" @click="moveDown(index)"
                                                            :disabled="index === orders.length - 1 || reorderSaving" title="Ниже">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                                                <polyline points="19 12 12 19 5 12"></polyline>
                                                            </svg>
                                                        </button>
                                                        <button class="btn-action" @click="openMoveOrderModal(order)" title="Перенести в другой рейс">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                                <polyline points="5 9 2 12 5 15"></polyline>
                                                                <polyline points="9 5 12 2 15 5"></polyline>
                                                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                                                <polyline points="15 19 12 22 9 19"></polyline>
                                                                <polyline points="19 15 22 12 19 9"></polyline>
                                                            </svg>
                                                        </button>
                                                        <button class="btn-action" @click="startEdit(order)" title="Редактировать">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                            </svg>
                                                        </button>
                                                        <button class="btn-action danger" @click="deleteOrder(order)" title="Удалить">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                                <path
                                                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                                                </path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </template>
                                                <template x-if="editingOrderId === order.id">
                                                    <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                        <button class="btn-action success" @click="saveEdit()" :disabled="savingEdit"
                                                            title="Сохранить">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <polyline points="20 6 9 17 4 12"></polyline>
                                                            </svg>
                                                        </button>
                                                        <button class="btn-action" @click="cancelEdit()" :disabled="savingEdit"
                                                            title="Отмена">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                                stroke-linejoin="round">
                                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <!-- Плашка под failed-заказом -->
                                    <template x-if="order.delivery_status === 'failed'">
                                        <tr class="failed-row">
                                            <td :colspan="9" style="padding:0;border-top:none;">
                                                <div class="failed-panel">
                                                    <div class="failed-panel-info">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                                            <line x1="12" y1="9" x2="12" y2="13"></line>
                                                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                                        </svg>
                                                        <span>Не доставлено<template x-if="order.delivery_note"><span x-text="' · ' + order.delivery_note"></span></template></span>
                                                    </div>
                                                    <div class="failed-panel-actions">
                                                        <button class="btn btn-secondary btn-sm" @click="openMoveOrderModal(order)">Перенести в другой рейс</button>
                                                        <button class="btn btn-secondary btn-sm" @click="returnOrderToPool(order)">Вернуть в пул</button>
                                                        <button class="btn btn-danger btn-sm" @click="cancelOrder(order)">Отменить заказ</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                
                                <!-- Новая строка добавления -->
                                <template x-if="newOrderRow">
                                    <tr class="row-editing">
                                        <td class="col-seq">
                                            <span x-text="orders.length + 1"></span>
                                        </td>
                                        <td class="col-id">
                                            <input type="text" x-model="newOrderForm.external_id" placeholder="#12345">
                                        </td>
                                        <td class="col-address">
                                            <input type="text" x-model="newOrderForm.address" placeholder="ул. Ленина, 15">
                                        </td>
                                        <td class="col-contact">
                                            <input type="text" x-model="newOrderForm.contact_name" placeholder="Иванов И.И.">
                                        </td>
                                        <td class="col-phone">
                                            <input type="text" x-model="newOrderForm.phone" placeholder="+79001234567">
                                        </td>
                                        <td class="col-volume">
                                            <input type="number" x-model.number="newOrderForm.volume" step="0.1" min="0">
                                        </td>
                                        <td class="col-status">
                                            <span class="delivery-badge delivery-pending">Ожидает</span>
                                        </td>
                                        <td class="col-note">
                                            <textarea x-model="newOrderForm.note" placeholder="Примечание"></textarea>
                                        </td>
                                        <td class="col-actions">
                                            <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                <button class="btn-action success" @click="saveNewOrder()" :disabled="savingNewOrder"
                                                    title="Добавить">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <polyline points="20 6 9 17 4 12"></polyline>
                                                    </svg>
                                                </button>
                                                <button class="btn-action" @click="cancelNewOrder()" :disabled="savingNewOrder"
                                                    title="Отмена">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                    </svg>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Затраты -->
                <div class="section-card">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            Затраты
                            <span style="font-weight:400;color:var(--text-secondary);font-size:13px;margin-left:8px;" x-text="'(' + totalCostsAll + ' ₽)'"></span>
                        </h2>
                        <div class="section-card-actions">
                            <button class="btn btn-secondary btn-sm" @click="addNewCost()" :disabled="newCostRow || editingCostId" v-show="!newCostRow">
                                + Добавить затрату
                            </button>
                        </div>
                    </div>

                    <div x-show="costs.length === 0 && autoCosts.length === 0 && !newCostRow" style="padding:40px;text-align:center;color:var(--text-secondary);font-size:13px;">
                        Затрат пока нет
                    </div>

                    <div x-show="costs.length > 0 || autoCosts.length > 0 || newCostRow" style="overflow-x:auto;">
                        <table class="cost-table-page">
                            <thead>
                                <tr>
                                    <th style="width:200px;">Категория</th>
                                    <th>Примечание</th>
                                    <th class="text-right" style="width:150px;">Сумма</th>
                                    <th style="width:120px;text-align:right;">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Автоматические затраты (только просмотр) -->
                                <template x-for="cost in autoCosts" :key="'auto-' + cost.category">
                                    <tr class="auto-row">
                                        <td x-text="categoryLabel(cost.category)"></td>
                                        <td x-text="cost.note" style="font-size:12px;"></td>
                                        <td class="col-amount" x-text="formatMoney(cost.amount)"></td>
                                        <td style="text-align:right;color:var(--text-muted);font-size:11px;">авто</td>
                                    </tr>
                                </template>

                                <!-- Обычные затраты -->
                                <template x-for="cost in costs" :key="cost.id">
                                    <tr :class="{ 'row-editing': editingCostId === cost.id }">
                                        <!-- Просмотр -->
                                        <template x-if="editingCostId !== cost.id">
                                            <td x-text="categoryLabel(cost.category)"></td>
                                        </template>
                                        <template x-if="editingCostId === cost.id">
                                            <td>
                                                <select x-model="editCostForm.category" class="form-input" style="font-size:12px;padding:4px 8px;">
                                                    <option value="fuel">Топливо</option>
                                                    <option value="toll">Платные дороги</option>
                                                    <option value="repair">Ремонт</option>
                                                    <option value="fine">Штрафы</option>
                                                    <option value="hired">Наёмный транспорт</option>
                                                    <option value="other">Прочее</option>
                                                </select>
                                            </td>
                                        </template>

                                        <template x-if="editingCostId !== cost.id">
                                            <td x-text="cost.note || '—'" style="color:var(--text-secondary);font-size:12px;"></td>
                                        </template>
                                        <template x-if="editingCostId === cost.id">
                                            <td>
                                                <input type="text" x-model="editCostForm.note" class="form-input" style="font-size:12px;padding:4px 8px;" placeholder="Примечание">
                                            </td>
                                        </template>

                                        <template x-if="editingCostId !== cost.id">
                                            <td class="col-amount" x-text="formatMoney(cost.amount)"></td>
                                        </template>
                                        <template x-if="editingCostId === cost.id">
                                            <td class="col-amount">
                                                <input type="number" x-model.number="editCostForm.amount" class="form-input" style="font-size:12px;padding:4px 8px;text-align:right;" step="0.01" min="0">
                                            </td>
                                        </template>

                                        <!-- Действия -->
                                        <td style="text-align:right;">
                                            <template x-if="editingCostId !== cost.id">
                                                <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                    <button class="btn-action" @click="startEditCost(cost)" title="Редактировать">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action danger" @click="deleteCost(cost)" title="Удалить">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <polyline points="3 6 5 6 21 6"></polyline>
                                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <template x-if="editingCostId === cost.id">
                                                <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                    <button class="btn-action success" @click="saveEditCost()" :disabled="savingCost" title="Сохранить">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <polyline points="20 6 9 17 4 12"></polyline>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action" @click="cancelEditCost()" :disabled="savingCost" title="Отмена">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>

                                <!-- Новая затрата -->
                                <template x-if="newCostRow">
                                    <tr class="row-editing">
                                        <td>
                                            <select x-model="newCostForm.category" class="form-input" style="font-size:12px;padding:4px 8px;">
                                                <option value="fuel">Топливо</option>
                                                <option value="toll">Платные дороги</option>
                                                <option value="repair">Ремонт</option>
                                                <option value="fine">Штрафы</option>
                                                <option value="hired">Наёмный транспорт</option>
                                                <option value="other">Прочее</option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="text" x-model="newCostForm.note" class="form-input" style="font-size:12px;padding:4px 8px;" placeholder="Примечание">
                                        </td>
                                        <td class="col-amount">
                                            <input type="number" x-model.number="newCostForm.amount" class="form-input" style="font-size:12px;padding:4px 8px;text-align:right;" step="0.01" min="0" placeholder="0">
                                        </td>
                                        <td style="text-align:right;">
                                            <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                <button class="btn-action success" @click="saveNewCost()" :disabled="savingCost" title="Добавить">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <polyline points="20 6 9 17 4 12"></polyline>
                                                    </svg>
                                                </button>
                                                <button class="btn-action" @click="cancelNewCost()" :disabled="savingCost" title="Отмена">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                    </svg>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="2">Итого затрат</td>
                                    <td class="col-amount" x-text="formatMoney(totalCostsAll)"></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- Действия -->
                <div class="trip-actions-bar">
                    <div class="left-actions">
                        <button class="btn btn-secondary" @click="printWaybill()" title="Распечатать путевой лист">
                            Путевой лист
                        </button>

                        <!-- Рейс в проблеме — показать "Решена проблема" -->
                        <template x-if="trip.status === 'problem'">
                            <button class="btn btn-primary" @click="openResolveProblemModal()">Решена проблема</button>
                        </template>

                        <!-- Рейс не в проблеме, не завершён — показать "Отметить проблему" -->
                        <template x-if="trip.status !== 'problem' && trip.status !== 'done' && trip.status !== 'cancelled'">
                            <button class="btn btn-secondary" @click="openProblemModal()">Отметить проблему</button>
                        </template>

                        <template x-if="trip.status !== 'done' && trip.status !== 'cancelled'">
                            <button class="btn btn-danger" @click="openCancelModal()">Отменить рейс</button>
                        </template>
                    </div>
                    <template x-if="(user?.role === 'admin' || user?.role === 'senior_logist') && trip.status !== 'transit' && trip.status !== 'done'">
                        <button class="btn btn-danger" @click="deleteTrip()">Удалить рейс</button>
                    </template>
                    <template x-if="!editingTrip">
                        <button class="btn btn-primary" @click="startEditTrip()">Редактировать</button>
                    </template>
                </div>

                <!-- МОДАЛКА: ПРОБЛЕМА -->
                <div x-show="problemModal.open" x-cloak class="modal-backdrop" @click.self="problemModal.open = false">
                    <div class="modal-window" @click.stop>
                        <div class="modal-header">
                            <h2 class="modal-title">Отметить проблему</h2>
                            <button class="modal-close" @click="problemModal.open = false">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div x-show="problemModal.error" class="alert alert-error" x-text="problemModal.error"></div>
                            <div class="form-group">
                                <label class="form-label">Что случилось? *</label>
                                <textarea class="form-input" x-model="problemModal.comment" rows="4" placeholder="Например: сломался двигатель, стоит на М-10, ждёт эвакуатор" :disabled="problemModal.saving"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" @click="problemModal.open = false" :disabled="problemModal.saving">Отмена</button>
                            <button class="btn btn-primary" @click="submitProblem()" :disabled="problemModal.saving">
                                <span x-show="!problemModal.saving">Отметить проблему</span>
                                <span x-show="problemModal.saving" x-cloak>Отправка...</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- МОДАЛКА: ОТМЕНА РЕЙСА -->
                <div x-show="cancelModal.open" x-cloak class="modal-backdrop" @click.self="cancelModal.open = false">
                    <div class="modal-window" @click.stop>
                        <div class="modal-header">
                            <h2 class="modal-title">Отменить рейс</h2>
                            <button class="modal-close" @click="cancelModal.open = false">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div x-show="cancelModal.error" class="alert alert-error" x-text="cancelModal.error"></div>

                            <div class="form-group">
                                <label class="form-label">Причина отмены *</label>
                                <textarea class="form-input" x-model="cancelModal.reason" rows="3" placeholder="Например: клиент отказался от доставки" :disabled="cancelModal.saving"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Что делать с заказами? *</label>
                                <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
                                    <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:12px;border:1px solid var(--border-light);border-radius:6px;">
                                        <input type="radio" value="return_to_incoming" x-model="cancelModal.orders_action" style="margin-top:2px;">
                                        <div>
                                            <div style="font-weight:500;font-size:13px;">Вернуть заказы в пул</div>
                                            <div style="font-size:12px;color:var(--text-secondary);">Заказы можно будет назначить на другие рейсы</div>
                                        </div>
                                    </label>
                                    <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:12px;border:1px solid var(--border-light);border-radius:6px;">
                                        <input type="radio" value="mark_cancelled" x-model="cancelModal.orders_action" style="margin-top:2px;">
                                        <div>
                                            <div style="font-weight:500;font-size:13px;">Пометить заказы отменёнными</div>
                                            <div style="font-size:12px;color:var(--text-secondary);">Заказы останутся в рейсе с пометкой «отменён»</div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" @click="cancelModal.open = false" :disabled="cancelModal.saving">Назад</button>
                            <button class="btn btn-danger" @click="submitCancel()" :disabled="cancelModal.saving">
                                <span x-show="!cancelModal.saving">Отменить рейс</span>
                                <span x-show="cancelModal.saving" x-cloak>Отмена...</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- МОДАЛКА: РЕШЕНА ПРОБЛЕМА -->
                <div x-show="resolveProblemModal.open" x-cloak class="modal-backdrop" @click.self="closeResolveProblemModal()">
                    <div class="modal-window" @click.stop>
                        <div class="modal-header">
                            <h2 class="modal-title">Вернуть рейс в работу</h2>
                            <button class="modal-close" @click="closeResolveProblemModal()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="modal-body">

    <!-- ПУТЕВОЙ ЛИСТ (для печати) -->

                            <template x-if="(o.delivery_status || 'pending') === 'failed'"><span>[✗] Не доставлено</span></template>
                            <template x-if="(o.delivery_status || 'pending') === 'cancelled'"><span>[—] Отменён</span></template>
                            <template x-if="!o.delivery_status || o.delivery_status === 'pending'"><span>[  ] Ожидает</span></template>

                    <td colspan="6">ИТОГО: <span x-text="orders.length"></span> адресов, <span x-text="totalVolume"></span> м³</td>
