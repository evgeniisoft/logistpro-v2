<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейс · ЛогистПро</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="tripPage()" x-init="$nextTick(() => init())">

    <header class="app-header">
        <div class="app-header-left">
            <a href="/" class="app-logo">
                <span class="app-logo-mark">LP</span>
                <span>ЛогистПро</span>
            </a>
            <nav class="app-nav">
                <a href="/" class="app-nav-link">Рейсы</a>
                <a href="/incoming.html" class="app-nav-link">Входящие</a>
                <a href="/reports.html" class="app-nav-link">Отчёты</a>
                <a href="/references.html" class="app-nav-link">Справочники</a>
                <a href="/journal.html" class="app-nav-link">Журнал</a>
            </nav>
        </div>
        <div class="app-header-right">
            <div class="user-badge">
                <div class="user-avatar" x-text="userInitials"></div>
                <div>
                    <div x-text="user?.full_name || ''" style="font-weight:500;"></div>
                    <div x-text="roleLabel" style="font-size:11px;opacity:0.7;"></div>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" @click="logout()" style="color:rgba(255,255,255,0.85);" title="Выйти">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div class="container">

            <!-- Загрузка -->
            <div x-show="loading" class="skeleton" style="height:400px;"></div>

            <!-- Ошибка -->
            <div x-show="error && !loading" x-cloak class="alert alert-error" x-text="error"></div>

            <!-- Контент -->
            <template x-if="!loading && !error && trip">
                <div>

                <!-- Шапка страницы -->
                <div class="trip-page-header">
                    <a href="/" class="back-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        К доске
                    </a>
                    <h1 class="trip-page-title">
                        <span x-text="'Рейс ' + trip.trip_number"></span>
                        <span class="trip-status-badge" :class="'trip-status-' + trip.status" x-text="statusLabel"></span>
                    </h1>
                </div>

                <!-- Информация о рейсе -->
                <div class="info-card">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-item-label">Дата</div>
                            <div class="info-item-value" x-text="formatDate(trip.trip_date)"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Тип рейса</div>
                            <div class="info-item-value" x-text="trip.trip_type === 'city' ? 'Городской' : 'Междугородний'"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Машина</div>
                            <div class="info-item-value" x-text="trip.vehicle_plate || '—'"></div>
                            <div class="info-item-sub" x-text="trip.vehicle_model || ''"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Водитель</div>
                            <div class="info-item-value" x-text="trip.driver_name || '—'"></div>
                            <div class="info-item-sub" x-text="trip.driver_rate_at_time ? formatMoney(trip.driver_rate_at_time) : ''"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Пробег план</div>
                            <div class="info-item-value" x-text="(trip.plan_km || 0) + ' км'"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Пробег факт</div>
                            <div class="info-item-value" x-text="(trip.fact_km || 0) + ' км'"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Ставка за рейс</div>
                            <div class="info-item-value" x-text="formatMoney(trip.driver_rate_at_time)"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-item-label">Выручка</div>
                            <div class="info-item-value" x-text="formatMoney(trip.revenue)"></div>
                        </div>
                    </div>

                    <div x-show="trip.comment" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border-light);">
                        <div class="info-item-label">Комментарий</div>
                        <div style="font-size:13px;color:var(--text-primary);margin-top:4px;" x-text="trip.comment"></div>
                    </div>

                    <div x-show="trip.status === 'problem' && trip.problem_comment" style="margin-top:20px;padding:12px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;">
                        <div style="font-size:11px;font-weight:600;color:#991B1B;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Проблема</div>
                        <div style="font-size:13px;color:#991B1B;" x-text="trip.problem_comment"></div>
                    </div>

                    <div x-show="trip.status === 'cancelled' && trip.cancel_reason" style="margin-top:20px;padding:12px 14px;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:8px;">
                        <div style="font-size:11px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Причина отмены</div>
                        <div style="font-size:13px;color:#6B7280;" x-text="trip.cancel_reason"></div>
                    </div>

                    <!-- Загрузка -->
                    <div class="trip-load-block">
                        <div class="trip-load-info">
                            <span>Загрузка: <strong x-text="totalVolume + ' м³'"></strong> из <strong x-text="vehicleVolume + ' м³'"></strong></span>
                            <span><strong x-text="loadPercent + '%'"></strong></span>
                        </div>
                        <div class="load-bar">
                            <div class="load-bar-fill" :class="loadColor" :style="'width:' + Math.min(loadPercent, 100) + '%'"></div>
                        </div>
                    </div>
                </div>

                <!-- Адреса доставки -->
                <div class="section-card">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            Адреса доставки
                            <span style="font-weight:400;color:var(--text-secondary);font-size:13px;margin-left:8px;"
                                x-text="'(' + orders.length + ')'"></span>
                        </h2>
                        <div class="section-card-actions">
                            <button class="btn btn-secondary btn-sm" @click="addNewOrder()" :disabled="reorderSaving || editingOrderId">
                                + Добавить адрес
                            </button>
                            <button class="btn btn-secondary btn-sm" disabled title="Будет добавлено на следующем этапе">
                                + Из входящих
                            </button>
                        </div>
                    </div>
                
                    <div x-show="orders.length === 0 && !newOrderRow"
                        style="padding:40px;text-align:center;color:var(--text-secondary);font-size:13px;">
                        В рейсе пока нет адресов
                    </div>
                
                    <div x-show="orders.length > 0 || newOrderRow" style="overflow-x:auto;">
                        <table class="address-table">
                            <thead>
                                <tr>
                                    <th class="col-seq">№</th>
                                    <th class="col-id">ID заказа</th>
                                    <th class="col-address">Адрес</th>
                                    <th class="col-contact">Контакт</th>
                                    <th class="col-phone">Телефон</th>
                                    <th class="col-volume text-right">м³</th>
                                    <th class="col-note">Примечание</th>
                                    <th class="col-actions">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Существующие заказы -->
                                <template x-for="(order, index) in orders" :key="order.id">
                                    <tr :class="{
                                        'dragging': draggedOrderId === order.id,
                                        'drag-over': dragOverOrderIndex === index && draggedOrderId !== order.id,
                                        'row-editing': editingOrderId === order.id
                                    }" :draggable="editingOrderId !== order.id && !reorderSaving"
                                        @dragstart="onDragStart(order.id, index)" @dragover.prevent="onDragOver(index)"
                                        @dragleave="onDragLeave(index)" @drop.prevent="onDrop(index)" @dragend="onDragEnd()">
                
                                        <!-- Режим просмотра -->
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-seq-with-handle">
                                                <span class="drag-handle" title="Перетащите для изменения порядка">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <circle cx="9" cy="6" r="1"></circle>
                                                        <circle cx="9" cy="12" r="1"></circle>
                                                        <circle cx="9" cy="18" r="1"></circle>
                                                        <circle cx="15" cy="6" r="1"></circle>
                                                        <circle cx="15" cy="12" r="1"></circle>
                                                        <circle cx="15" cy="18" r="1"></circle>
                                                    </svg>
                                                </span>
                                                <span class="seq-number" x-text="index + 1"></span>
                                            </td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-seq">
                                                <span x-text="index + 1"></span>
                                            </td>
                                        </template>
                
                                        <!-- Просмотр/редактирование -->
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-id">
                                                <span x-text="order.external_id || ('#' + order.id)"></span>
                                            </td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-id">
                                                <input type="text" x-model="editForm.external_id" placeholder="#12345">
                                            </td>
                                        </template>
                
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-address" x-text="order.address"></td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-address">
                                                <input type="text" x-model="editForm.address" placeholder="ул. Ленина, 15">
                                            </td>
                                        </template>
                
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-contact" x-text="order.contact_name || '—'"></td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-contact">
                                                <input type="text" x-model="editForm.contact_name" placeholder="Иванов И.И.">
                                            </td>
                                        </template>
                
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-phone" x-text="order.phone || '—'"></td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-phone">
                                                <input type="text" x-model="editForm.phone" placeholder="+79001234567">
                                            </td>
                                        </template>
                
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-volume" x-text="order.volume || '—'"></td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-volume">
                                                <input type="number" x-model.number="editForm.volume" step="0.1" min="0">
                                            </td>
                                        </template>
                
                                        <template x-if="editingOrderId !== order.id">
                                            <td class="col-note">
                                                <template x-if="order.note">
                                                    <span class="addr-note-preview" :title="order.note" x-text="order.note"></span>
                                                </template>
                                                <template x-if="!order.note">
                                                    <span style="color:var(--text-muted);">—</span>
                                                </template>
                                            </td>
                                        </template>
                                        <template x-if="editingOrderId === order.id">
                                            <td class="col-note">
                                                <textarea x-model="editForm.note" placeholder="Примечание"></textarea>
                                            </td>
                                        </template>
                
                                        <!-- Действия -->
                                        <td class="col-actions">
                                            <template x-if="editingOrderId !== order.id">
                                                <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                    <button class="btn-action" @click="moveUp(index)"
                                                        :disabled="index === 0 || reorderSaving" title="Выше">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <line x1="12" y1="19" x2="12" y2="5"></line>
                                                            <polyline points="5 12 12 5 19 12"></polyline>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action" @click="moveDown(index)"
                                                        :disabled="index === orders.length - 1 || reorderSaving" title="Ниже">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <line x1="12" y1="5" x2="12" y2="19"></line>
                                                            <polyline points="19 12 12 19 5 12"></polyline>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action" @click="startEdit(order)" title="Редактировать">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action danger" @click="deleteOrder(order)" title="Удалить">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <polyline points="3 6 5 6 21 6"></polyline>
                                                            <path
                                                                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                                            </path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <template x-if="editingOrderId === order.id">
                                                <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                    <button class="btn-action success" @click="saveEdit()" :disabled="savingEdit"
                                                        title="Сохранить">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <polyline points="20 6 9 17 4 12"></polyline>
                                                        </svg>
                                                    </button>
                                                    <button class="btn-action" @click="cancelEdit()" :disabled="savingEdit"
                                                        title="Отмена">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                
                                <!-- Новая строка добавления -->
                                <template x-if="newOrderRow">
                                    <tr class="row-editing">
                                        <td class="col-seq">
                                            <span x-text="orders.length + 1"></span>
                                        </td>
                                        <td class="col-id">
                                            <input type="text" x-model="newOrderForm.external_id" placeholder="#12345">
                                        </td>
                                        <td class="col-address">
                                            <input type="text" x-model="newOrderForm.address" placeholder="ул. Ленина, 15">
                                        </td>
                                        <td class="col-contact">
                                            <input type="text" x-model="newOrderForm.contact_name" placeholder="Иванов И.И.">
                                        </td>
                                        <td class="col-phone">
                                            <input type="text" x-model="newOrderForm.phone" placeholder="+79001234567">
                                        </td>
                                        <td class="col-volume">
                                            <input type="number" x-model.number="newOrderForm.volume" step="0.1" min="0">
                                        </td>
                                        <td class="col-note">
                                            <textarea x-model="newOrderForm.note" placeholder="Примечание"></textarea>
                                        </td>
                                        <td class="col-actions">
                                            <div style="display:flex;gap:2px;justify-content:flex-end;">
                                                <button class="btn-action success" @click="saveNewOrder()" :disabled="savingNewOrder"
                                                    title="Добавить">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <polyline points="20 6 9 17 4 12"></polyline>
                                                    </svg>
                                                </button>
                                                <button class="btn-action" @click="cancelNewOrder()" :disabled="savingNewOrder"
                                                    title="Отмена">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                                    </svg>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Затраты -->
                <div class="section-card">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            Затраты
                            <span style="font-weight:400;color:var(--text-secondary);font-size:13px;margin-left:8px;" x-text="'(' + totalCosts + ' ₽)'"></span>
                        </h2>
                        <div class="section-card-actions">
                            <button class="btn btn-secondary btn-sm" disabled title="Будет добавлено на следующем этапе">+ Добавить затрату</button>
                        </div>
                    </div>

                    <div x-show="costs.length === 0" style="padding:40px;text-align:center;color:var(--text-secondary);font-size:13px;">
                        Затрат пока нет
                    </div>

                    <div x-show="costs.length > 0" style="overflow-x:auto;">
                        <table class="cost-table-page">
                            <thead>
                                <tr>
                                    <th style="width:200px;">Категория</th>
                                    <th>Примечание</th>
                                    <th class="text-right" style="width:150px;">Сумма</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="cost in costs" :key="cost.id">
                                    <tr>
                                        <td x-text="categoryLabel(cost.category)"></td>
                                        <td x-text="cost.note || '—'" style="color:var(--text-secondary);font-size:12px;"></td>
                                        <td class="col-amount" x-text="formatMoney(cost.amount)"></td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="2">Итого затрат</td>
                                    <td class="col-amount" x-text="formatMoney(totalCosts)"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- Действия -->
                <div class="trip-actions-bar">
                    <div class="left-actions">
                        <button class="btn btn-secondary" disabled title="Будет добавлено на следующем этапе">Отметить проблему</button>
                        <button class="btn btn-danger" disabled title="Будет добавлено на следующем этапе">Отменить рейс</button>
                    </div>
                    <button class="btn btn-secondary" disabled title="Будет добавлено на следующем этапе">Удалить рейс</button>
                    <button class="btn btn-primary" @click="goBack()">К доске</button>
                </div>

            </div>
            </div>
        </template>
        </div>
    </main>

    <script>
        function tripPage() {
            return {
                user: null,
                trip: null,
                orders: [],
                costs: [],
                loading: true,
                error: '',

                // Drag & drop состояние
                draggedOrderId: null,
                draggedOrderIndex: null,
                dragOverOrderIndex: null,
                reorderSaving: false,

                // Inline редактирование
                editingOrderId: null,
                editForm: {},
                savingEdit: false,

                // Добавление нового
                newOrderRow: false,
                newOrderForm: {},
                savingNewOrder: false,

                get userInitials() {
                    if (!this.user?.full_name) return '?';
                    return this.user.full_name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                },

                get roleLabel() {
                    const roles = { 'admin': 'Администратор', 'senior_logist': 'Ст. логист', 'logist': 'Логист', 'manager': 'Руководитель', 'viewer': 'Наблюдатель' };
                    return roles[this.user?.role] || this.user?.role || '';
                },

                get statusLabel() {
                    const labels = {
                        'forming': 'Формируется', 'loading': 'Загрузка', 'transit': 'В пути',
                        'problem': 'Проблема', 'done': 'Завершён', 'cancelled': 'Отменён'
                    };
                    return labels[this.trip?.status] || this.trip?.status || '';
                },

                get vehicleVolume() {
                    return Number(this.trip?.vehicle_volume_at_time) || Number(this.trip?.vehicle_volume) || 0;
                },

                get totalVolume() {
                    const total = this.orders.reduce((sum, o) => sum + (Number(o.volume) || 0), 0);
                    return Math.round(total * 100) / 100;
                },

                get loadPercent() {
                    const cap = this.vehicleVolume;
                    if (!cap) return 0;
                    return Math.round(this.totalVolume / cap * 100);
                },

                get loadColor() {
                    const p = this.loadPercent;
                    if (p > 100) return 'load-orange';
                    if (p >= 81) return 'load-green';
                    if (p >= 51) return 'load-yellow';
                    return 'load-red';
                },

                get totalCosts() {
                    return this.costs.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
                },

                async init() {
                    if (!window.AUTH) {
                        setTimeout(() => this.init(), 50);
                        return;
                    }
                    if (!window.AUTH.requireLogin()) return;
                    this.user = window.API.getUser();

                    const params = new URLSearchParams(window.location.search);
                    const tripId = params.get('id');

                    if (!tripId) {
                        this.error = 'Не указан ID рейса';
                        this.loading = false;
                        return;
                    }

                    await this.loadTrip(tripId);
                },

                async loadTrip(tripId) {
                    this.loading = true;
                    this.error = '';
                    try {
                        const data = await window.API.api('/api/trips?action=get&id=' + tripId);
                        this.trip = data.trip;
                        this.orders = data.orders || [];
                        this.costs = data.costs || [];
                        document.title = 'Рейс ' + this.trip.trip_number + ' · ЛогистПро';
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                // ============ DRAG & DROP ============

                onDragStart(orderId, index) {
                    this.draggedOrderId = orderId;
                    this.draggedOrderIndex = index;
                },

                onDragOver(index) {
                    if (this.draggedOrderId === null) return;
                    this.dragOverOrderIndex = index;
                },

                onDragLeave(index) {
                    if (this.dragOverOrderIndex === index) {
                        this.dragOverOrderIndex = null;
                    }
                },

                async onDrop(targetIndex) {
                    const sourceIndex = this.draggedOrderIndex;
                    this.draggedOrderId = null;
                    this.draggedOrderIndex = null;
                    this.dragOverOrderIndex = null;

                    if (sourceIndex === null || sourceIndex === targetIndex) return;

                    // Переставляем локально
                    const moved = this.orders.splice(sourceIndex, 1)[0];
                    this.orders.splice(targetIndex, 0, moved);

                    // Сохраняем на сервере
                    await this.saveOrder()
                },

                onDragEnd() {
                    this.draggedOrderId = null;
                    this.draggedOrderIndex = null;
                    this.dragOverOrderIndex = null;
                },

                // ============ КНОПКИ ВВЕРХ/ВНИЗ ============

                async moveUp(index) {
                    if (index === 0) return;
                    const moved = this.orders.splice(index, 1)[0];
                    this.orders.splice(index - 1, 0, moved);
                    await this.saveOrder();
                },

                async moveDown(index) {
                    if (index === this.orders.length - 1) return;
                    const moved = this.orders.splice(index, 1)[0];
                    this.orders.splice(index + 1, 0, moved);
                    await this.saveOrder();
                },

                // Сохранение очерёдности на сервере
                async saveOrder() {
                    this.reorderSaving = true;
                    try {
                        const orderIds = this.orders.map(o => o.id);
                        await window.API.api('/api/trips?action=reorder&id=' + this.trip.id, {
                            method: 'POST',
                            body: JSON.stringify({ order_ids: orderIds })
                        });
                    } catch (e) {
                        alert('Ошибка сохранения порядка: ' + e.message);
                        // Перезагружаем с сервера
                        await this.loadTrip(this.trip.id);
                    } finally {
                        this.reorderSaving = false;
                    }
                },

                // ============ INLINE РЕДАКТИРОВАНИЕ ============

                startEdit(order) {
                    this.editingOrderId = order.id;
                    this.editForm = {
                        external_id: order.external_id || '',
                        address: order.address,
                        contact_name: order.contact_name || '',
                        phone: order.phone || '',
                        volume: order.volume || 0,
                        note: order.note || ''
                    };
                },

                cancelEdit() {
                    this.editingOrderId = null;
                    this.editForm = {};
                },

                async saveEdit() {
                    if (!this.editForm.address || !this.editForm.address.trim()) {
                        alert('Адрес обязателен');
                        return;
                    }

                    this.savingEdit = true;
                    try {
                        await window.API.api('/api/orders?action=update&id=' + this.editingOrderId, {
                            method: 'PUT',
                            body: JSON.stringify({
                                external_id: this.editForm.external_id || null,
                                address: this.editForm.address.trim(),
                                contact_name: this.editForm.contact_name || null,
                                phone: this.editForm.phone || null,
                                volume: Number(this.editForm.volume) || 0,
                                note: this.editForm.note || null
                            })
                        });

                        // Обновляем локально
                        const order = this.orders.find(o => o.id === this.editingOrderId);
                        if (order) {
                            order.external_id = this.editForm.external_id || null;
                            order.address = this.editForm.address.trim();
                            order.contact_name = this.editForm.contact_name || null;
                            order.phone = this.editForm.phone || null;
                            order.volume = Number(this.editForm.volume) || 0;
                            order.note = this.editForm.note || null;
                        }

                        this.editingOrderId = null;
                        this.editForm = {};
                    } catch (e) {
                        alert('Ошибка сохранения: ' + e.message);
                    } finally {
                        this.savingEdit = false;
                    }
                },

                // ============ ДОБАВЛЕНИЕ ============

                addNewOrder() {
                    this.newOrderRow = true;
                    this.newOrderForm = {
                        external_id: '',
                        address: '',
                        contact_name: '',
                        phone: '',
                        volume: 0,
                        note: ''
                    };
                },

                cancelNewOrder() {
                    this.newOrderRow = false;
                    this.newOrderForm = {};
                },

                async saveNewOrder() {
                    if (!this.newOrderForm.address || !this.newOrderForm.address.trim()) {
                        alert('Адрес обязателен');
                        return;
                    }

                    this.savingNewOrder = true;
                    try {
                        const data = await window.API.api('/api/orders?action=create', {
                            method: 'POST',
                            body: JSON.stringify({
                                trip_id: this.trip.id,
                                external_id: this.newOrderForm.external_id || null,
                                address: this.newOrderForm.address.trim(),
                                contact_name: this.newOrderForm.contact_name || null,
                                phone: this.newOrderForm.phone || null,
                                volume: Number(this.newOrderForm.volume) || 0,
                                note: this.newOrderForm.note || null
                            })
                        });

                        // Добавляем локально
                        this.orders.push(data.order);

                        // Сбрасываем форму
                        this.newOrderRow = false;
                        this.newOrderForm = {};

                    } catch (e) {
                        alert('Ошибка добавления: ' + e.message);
                    } finally {
                        this.savingNewOrder = false;
                    }
                },

                // ============ УДАЛЕНИЕ ============

                async deleteOrder(order) {
                    if (!confirm('Удалить адрес "' + order.address + '"?')) return;

                    try {
                        await window.API.api('/api/orders?action=delete&id=' + order.id, {
                            method: 'DELETE'
                        });

                        // Удаляем из локального массива
                        this.orders = this.orders.filter(o => o.id !== order.id);
                    } catch (e) {
                        alert('Ошибка удаления: ' + e.message);
                    }
                },

                // ============ ХЕЛПЕРЫ ============

                formatDate(d) {
                    if (!d) return '—';
                    return window.HELPERS.formatDate(d);
                },

                formatMoney(v) {
                    return window.HELPERS.formatMoney(v);
                },

                categoryLabel(cat) {
                    const labels = {
                        'salary': 'Зарплата', 'amort': 'Амортизация', 'fuel': 'Топливо',
                        'toll': 'Платные дороги', 'repair': 'Ремонт', 'fine': 'Штрафы', 'other': 'Прочее'
                    };
                    return labels[cat] || cat;
                },

                goBack() {
                    window.location.href = '/';
                },

                logout() {
                    if (!confirm('Выйти из системы?')) return;
                    window.API.clearAuth();
                    window.location.href = '/login.html';
                }
            };
        }
    </script>
</body>
</html>
